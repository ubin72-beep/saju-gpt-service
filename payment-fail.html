<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #666 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .container { background: white; border-radius: 20px; padding: 3rem; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .fail-icon { font-size: 4rem; color: #F44336; margin-bottom: 1.5rem; animation: shake 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        h1 { font-family: 'Noto Serif KR', serif; font-size: 2rem; color: #1a1a1a; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 2rem; }
        .error-info { background: #ffebee; border: 1px solid #F44336; border-radius: 15px; padding: 2rem; margin-bottom: 2rem; }
        .error-title { font-weight: bold; color: #c41e3a; margin-bottom: 1rem; font-size: 1.1rem; }
        .error-message { color: #666; line-height: 1.6; }
        .button-group { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn { flex: 1; padding: 1rem; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
        .btn-primary { background: #c41e3a; color: white; }
        .btn-primary:hover { background: #a01830; transform: scale(1.05); }
        .btn-secondary { background: #f0f0f0; color: #666; }
        .btn-secondary:hover { background: #e0e0e0; }
        .help-box { background: #f9f9f9; border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; text-align: left; }
        .help-box h3 { font-size: 1rem; margin-bottom: 1rem; color: #1a1a1a; }
        .help-box ul { padding-left: 1.5rem; }
        .help-box li { margin-bottom: 0.5rem; color: #666; line-height: 1.6; }
        .contact { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 1rem; margin-top: 1.5rem; font-size: 0.9rem; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <div class="fail-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        
        <h1>결제에 실패했습니다</h1>
        <p class="subtitle">결제 처리 중 문제가 발생했습니다.</p>
        
        <div class="error-info">
            <div class="error-title" id="errorTitle">
                <i class="fas fa-exclamation-triangle"></i> 결제 실패 사유
            </div>
            <div class="error-message" id="errorMessage">
                잠시 후 다시 시도해주세요.
            </div>
        </div>
        
        <div class="help-box">
            <h3><i class="fas fa-lightbulb"></i> 결제 실패 시 확인사항</h3>
            <ul>
                <li>카드 정보가 정확한지 확인해주세요.</li>
                <li>결제 한도가 충분한지 확인해주세요.</li>
                <li>인터넷 연결 상태를 확인해주세요.</li>
                <li>다른 결제 수단을 시도해보세요.</li>
                <li>문제가 계속되면 고객센터로 문의해주세요.</li>
            </ul>
        </div>
        
        <div class="contact">
            <i class="fas fa-headset"></i>
            <strong>고객센터</strong><br>
            전화: 0502-1909-7788<br>
            이메일: <a href="mailto:aisaju1000@gmail.com" style="color: #c41e3a;">aisaju1000@gmail.com</a><br>
            평일 09:00 - 18:00
        </div>
        
        <div class="button-group">
            <a href="pricing.html" class="btn btn-primary">
                <i class="fas fa-redo"></i> 다시 시도
            </a>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> 홈으로
            </a>
        </div>
    </div>

    <script>
        // URL에서 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const message = urlParams.get('message');
        const orderId = urlParams.get('orderId');
        
        console.log('❌ 결제 실패 페이지 로드');
        console.log('code:', code);
        console.log('message:', message);
        console.log('orderId:', orderId);
        
        // 오류 메시지 표시
        if (message) {
            const errorMessage = decodeURIComponent(message);
            document.getElementById('errorMessage').textContent = errorMessage;
        }
        
        if (code) {
            document.getElementById('errorTitle').innerHTML = `
                <i class="fas fa-exclamation-triangle"></i> 오류 코드: ${code}
            `;
        }
        
        // 실패 내역 저장 (선택사항)
        if (orderId) {
            try {
                const failedPayments = JSON.parse(localStorage.getItem('failedPayments') || '[]');
                failedPayments.unshift({
                    orderId: orderId,
                    code: code,
                    message: message,
                    failedAt: new Date().toISOString()
                });
                // 최근 10개만 저장
                if (failedPayments.length > 10) {
                    failedPayments.pop();
                }
                localStorage.setItem('failedPayments', JSON.stringify(failedPayments));
            } catch (error) {
                console.error('실패 내역 저장 실패:', error);
            }
        }
    </script>
</body>
</html>
