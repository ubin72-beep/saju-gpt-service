<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            text-align: center;
        }
        
        .fail-icon {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            padding: 40px;
            color: white;
        }
        
        .fail-icon i {
            font-size: 5rem;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .content h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        
        .content p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .error-info {
            background: #ffebee;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 4px solid #e74c3c;
        }
        
        .error-message {
            color: #c62828;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .error-details {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.9rem;
            color: #666;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
        }
        
        .help-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #856404;
            text-align: left;
        }
        
        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fail-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        
        <div class="content">
            <h1>❌ 결제가 실패했습니다</h1>
            <p>결제 처리 중 문제가 발생했습니다.</p>
            
            <div class="error-info">
                <div class="error-message" id="errorMessage">
                    결제가 취소되었거나 오류가 발생했습니다.
                </div>
                <div class="error-details">
                    <strong>실패 사유:</strong><br>
                    <span id="errorCode">-</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <a href="javascript:history.back()" class="btn btn-primary">
                    <i class="fas fa-redo"></i> 다시 시도하기
                </a>
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> 홈으로
                </a>
            </div>
            
            <div class="help-section">
                <i class="fas fa-question-circle"></i>
                <strong>도움이 필요하신가요?</strong><br>
                • 고객센터: 0502-1909-7788<br>
                • 이메일: aisaju1000@gmail.com<br>
                • 평일 09:00 ~ 18:00 (주말·공휴일 휴무)
            </div>
        </div>
    </div>
    
    <script>
        // URL 파라미터에서 오류 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const message = urlParams.get('message');
        
        // 오류 메시지 매핑
        const errorMessages = {
            'USER_CANCEL': '사용자가 결제를 취소했습니다.',
            'INVALID_CARD': '유효하지 않은 카드입니다.',
            'INSUFFICIENT_FUNDS': '잔액이 부족합니다.',
            'EXCEED_MAX_AMOUNT': '결제 한도를 초과했습니다.',
            'CARD_EXPIRED': '카드 유효기간이 만료되었습니다.',
            'INVALID_CARD_NUMBER': '잘못된 카드 번호입니다.',
            'INVALID_EXPIRATION': '잘못된 유효기간입니다.',
            'INVALID_AUTH': '카드 인증에 실패했습니다.',
            'PAYMENT_TIMEOUT': '결제 시간이 초과되었습니다.',
            'UNKNOWN': '알 수 없는 오류가 발생했습니다.'
        };
        
        // 오류 정보 표시
        if (code) {
            const errorMsg = errorMessages[code] || errorMessages['UNKNOWN'];
            document.getElementById('errorMessage').textContent = errorMsg;
            document.getElementById('errorCode').textContent = message || code;
        }
        
        console.log('❌ 결제 실패:', { code, message });
    </script>
</body>
</html>
