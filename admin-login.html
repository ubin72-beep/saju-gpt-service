   244	<body>
   245	    <div class="login-container">

   255	            <form id="adminLoginForm">
   256	                <div class="form-group">

   258	                    <div class="input-group">

   307	    <script>
   308	        // 환경 설정 (실제 배포 시 환경 변수로 관리)
   309	        const API_CONFIG = {
   310	            // 개발 환경
   311	            dev: {
   312	                baseURL: 'http://localhost:3000',
   313	                apiEndpoint: '/api/admin/login'
   314	            },
   315	            // 프로덕션 환경
   316	            prod: {
   317	                baseURL: 'https://api.aisaju1000.com',
   318	                apiEndpoint: '/api/admin/login'
   319	            }
   320	        };
   321	
   322	        // 현재 환경 (실제로는 환경 변수로 설정)
   323	        const CURRENT_ENV = window.location.hostname === 'localhost' ? 'dev' : 'prod';
   324	        const API = API_CONFIG[CURRENT_ENV];
   325	
   326	        // 로그인 시도 횟수 제한
   327	        let loginAttempts = 0;
   328	        const MAX_ATTEMPTS = 5;
   329	        const LOCKOUT_TIME = 15 * 60 * 1000; // 15분
   330	
   331	        // 페이지 로드 시 잠금 상태 확인
   332	        document.addEventListener('DOMContentLoaded', function() {
   333	            checkLockout();
   334	            
   335	            // 이미 로그인되어 있는지 확인
   336	            const token = getAuthToken();
   337	            if (token && validateToken(token)) {
   338	                window.location.href = 'admin.html';
   339	            }
   340	        });
   341	
   342	        // 로그인 폼 제출
   343	        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
   344	            e.preventDefault();
   345	            
   346	            // 잠금 상태 확인
   347	            if (checkLockout()) {
   348	                return;
   349	            }
   350	
   351	            const username = document.getElementById('username').value.trim();
   352	            const password = document.getElementById('password').value;
   353	            const remember = document.getElementById('remember').checked;
   354	
   355	            // 입력 검증
   356	            if (!username || !password) {
   357	                showAlert('아이디와 비밀번호를 입력해주세요.', 'danger');
   358	                return;
   359	            }
   360	
   361	            // 보안: 최소 길이 체크
   362	            if (password.length < 8) {
   363	                showAlert('비밀번호는 최소 8자 이상이어야 합니다.', 'warning');
   364	                return;
   365	            }
   366	
   367	            // 로그인 처리
   368	            await handleLogin(username, password, remember);
   369	        });
   370	
   371	        // 로그인 처리 함수
   372	        async function handleLogin(username, password, remember) {
   373	            const loginBtn = document.getElementById('loginBtn');
   374	            const btnText = loginBtn.querySelector('span');
   375	            const btnIcon = loginBtn.querySelector('i');
   376	            
   377	            try {
   378	                // 버튼 비활성화 및 로딩 표시
   379	                loginBtn.disabled = true;
   380	                btnIcon.className = 'loading-spinner';
   381	                btnText.textContent = '로그인 중...';
   382	
   383	                // 백엔드 API 호출
   384	                const response = await fetch(`${API.baseURL}${API.apiEndpoint}`, {
   385	                    method: 'POST',
   386	                    headers: {
   387	                        'Content-Type': 'application/json'
   388	                    },
   389	                    body: JSON.stringify({
   390	                        username: username,
   391	                        password: password
   392	                    })
   393	                });
   394	
   395	                const data = await response.json();
   396	
   397	                if (response.ok && data.success) {
   398	                    // 로그인 성공
   399	                    loginAttempts = 0;
   400	                    localStorage.removeItem('loginAttempts');
   401	                    localStorage.removeItem('lockoutUntil');
   402	
   403	                    // JWT 토큰 저장
   404	                    const storage = remember ? localStorage : sessionStorage;
   405	                    storage.setItem('adminToken', data.token);
   406	                    storage.setItem('adminUser', JSON.stringify(data.user));
   407	
   408	                    showAlert('로그인 성공! 관리자 페이지로 이동합니다.', 'success');
   409	
   410	                    // 2초 후 관리자 페이지로 이동
   411	                    setTimeout(() => {
   412	                        window.location.href = 'admin.html';
   413	                    }, 2000);
   414	
   415	                } else {
   416	                    // 로그인 실패
   417	                    handleLoginFailure(data.message || '로그인에 실패했습니다.');
   418	                }
   419	
   420	            } catch (error) {
   421	                console.error('Login error:', error);
   422	                
   423	                // 네트워크 오류 또는 서버 오류
   424	                if (error.message.includes('Failed to fetch')) {
   425	                    showAlert('서버에 연결할 수 없습니다. 네트워크 연결을 확인해주세요.', 'danger');
   426	                } else {
   427	                    // 백엔드 API가 없을 경우 임시 인증 (개발 환경)
   428	                    if (CURRENT_ENV === 'dev') {
   429	                        handleDemoLogin(username, password, remember);
   430	                    } else {
   431	                        showAlert('로그인 처리 중 오류가 발생했습니다.', 'danger');
   432	                    }
   433	                }
   434	
   435	            } finally {
   436	                // 버튼 복원
   437	                loginBtn.disabled = false;
   438	                btnIcon.className = 'fas fa-sign-in-alt';
   439	                btnText.textContent = '로그인';
   440	            }
   441	        }
   442	
   443	        // 데모 로그인 (개발 환경용)
   444	        function handleDemoLogin(username, password, remember) {
   445	            // 임시 관리자 계정 (실제로는 백엔드에서 처리)
   446	            const DEMO_ADMIN = {
   447	                username: 'admin',
   448	                password: 'Admin@2026!',  // 변경된 강력한 비밀번호
   449	            };
   450	
   451	            if (username === DEMO_ADMIN.username && password === DEMO_ADMIN.password) {
   452	                loginAttempts = 0;
   453	                localStorage.removeItem('loginAttempts');
   454	                localStorage.removeItem('lockoutUntil');
   455	
   456	                // 임시 토큰 생성
   457	                const demoToken = btoa(JSON.stringify({
   458	                    username: username,
   459	                    role: 'admin',
   460	                    exp: Date.now() + (remember ? 30 * 24 * 60 * 60 * 1000 : 24 * 60 * 60 * 1000)
   461	                }));
   462	
   463	                const storage = remember ? localStorage : sessionStorage;
   464	                storage.setItem('adminToken', demoToken);
   465	                storage.setItem('adminUser', JSON.stringify({
   466	                    id: 1,
   467	                    username: username,
   468	                    role: 'admin'
   469	                }));
   470	
   471	                showAlert('로그인 성공! (개발 모드)', 'success');
   472	
   473	                setTimeout(() => {
   474	                    window.location.href = 'admin.html';
   475	                }, 1500);
   476	
   477	            } else {
   478	                handleLoginFailure('아이디 또는 비밀번호가 올바르지 않습니다.');
   479	            }
   480	        }
   481	
   482	        // 로그인 실패 처리
   483	        function handleLoginFailure(message) {
   484	            loginAttempts++;
   485	            localStorage.setItem('loginAttempts', loginAttempts);
   486	
   487	            const remainingAttempts = MAX_ATTEMPTS - loginAttempts;
   488	
   489	            if (loginAttempts >= MAX_ATTEMPTS) {
   490	                // 계정 잠금
   491	                const lockoutUntil = Date.now() + LOCKOUT_TIME;
   492	                localStorage.setItem('lockoutUntil', lockoutUntil);
   493	                showAlert(`너무 많은 로그인 시도로 인해 15분간 로그인이 제한됩니다.`, 'danger');
   494	            } else {
   495	                showAlert(`${message} (남은 시도: ${remainingAttempts}회)`, 'danger');
   496	            }
   497	        }
   498	
   499	        // 잠금 상태 확인
   500	        function checkLockout() {
   501	            const lockoutUntil = localStorage.getItem('lockoutUntil');
   502	            
   503	            if (lockoutUntil) {
   504	                const remaining = parseInt(lockoutUntil) - Date.now();
   505	                
   506	                if (remaining > 0) {
   507	                    const minutes = Math.ceil(remaining / 60000);
   508	                    showAlert(`로그인이 제한되었습니다. ${minutes}분 후에 다시 시도해주세요.`, 'warning');
   509	                    document.getElementById('loginBtn').disabled = true;
   510	                    return true;
   511	                } else {
   512	                    // 잠금 해제
   513	                    localStorage.removeItem('lockoutUntil');
   514	                    localStorage.removeItem('loginAttempts');
   515	                    loginAttempts = 0;
   516	                }
   517	            }
   518	            
   519	            return false;
   520	        }
   521	
   522	        // 토큰 가져오기
   523	        function getAuthToken() {
   524	            return localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
   525	        }
   526	
   527	        // 토큰 검증 (간단한 검증)
   528	        function validateToken(token) {
   529	            try {
   530	                const payload = JSON.parse(atob(token.split('.')[1] || token));
   531	                return payload.exp > Date.now();
   532	            } catch {
   533	                return false;
   534	            }
   535	        }
   536	
   537	        // 알림 표시
   538	        function showAlert(message, type) {
   539	            const alertBox = document.getElementById('alertBox');
   540	            alertBox.className = `alert alert-${type} show`;
   541	            alertBox.textContent = message;
   542	
   543	            // 5초 후 자동 숨김
   544	            setTimeout(() => {
   545	                alertBox.classList.remove('show');
   546	            }, 5000);
   547	        }
   548	
   549	        // 전역 에러 핸들러
   550	        window.addEventListener('error', function(e) {
   551	            if (e.filename && !e.filename.includes('aisaju1000.com')) {
   552	                e.preventDefault();
   553	                return true;
   554	            }
   555	        }, true);
   556

   561	        // });
