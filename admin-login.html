<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .login-header i {
            font-size: 4rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .login-header p {
            font-size: 1rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .info-badge {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            padding: 1rem 1.5rem;
            margin: 1.5rem 2rem;
            border-radius: 12px;
            font-size: 0.9rem;
            border: 2px solid #f0c800;
            box-shadow: 0 4px 12px rgba(255,215,0,0.3);
        }

        .info-badge strong {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .credentials-box {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 0.75rem;
            display: flex;
            justify-content: space-around;
        }

        .credential-item {
            text-align: center;
        }

        .credential-item label {
            display: block;
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 0.25rem;
        }

        .credential-item .value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #000;
            font-size: 1rem;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        .login-body {
            padding: 2.5rem 2rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert i {
            font-size: 1.25rem;
        }

        .alert-danger {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: #c41e3a;
            background: white;
            box-shadow: 0 0 0 4px rgba(196,30,58,0.1);
        }

        .form-control:hover {
            border-color: #bbb;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #c41e3a;
        }

        .checkbox-wrapper label {
            font-size: 0.95rem;
            color: #666;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(196,30,58,0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196,30,58,0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login span {
            position: relative;
            z-index: 1;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .login-footer a {
            color: #c41e3a;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .login-footer a:hover {
            color: #a01830;
            gap: 0.75rem;
        }

        /* 반응형 디자인 */
        @media (max-width: 576px) {
            .login-container {
                margin: 10px;
            }

            .login-header {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-body {
                padding: 2rem 1.5rem;
            }

            .info-badge {
                margin: 1rem 1.5rem;
                padding: 0.875rem 1rem;
                font-size: 0.85rem;
            }

            .credential-item .value {
                font-size: 0.9rem;
                padding: 0.375rem 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 헤더 -->
        <div class="login-header">
            <i class="fas fa-shield-halved"></i>
            <h1>관리자 로그인</h1>
            <p>AI 사주 천년지기 관리 시스템</p>
        </div>

        <!-- 안내 메시지 -->
        <div class="info-badge">
            <strong>🔐 테스트 계정 안내</strong>
            백엔드 서버 배포 전까지 로컬 인증을 사용합니다.<br>
            아래 계정으로 로그인하세요.
            
            <div class="credentials-box">
                <div class="credential-item">
                    <label>아이디</label>
                    <div class="value">admin</div>
                </div>
                <div class="credential-item">
                    <label>비밀번호</label>
                    <div class="value">admin1234</div>
                </div>
            </div>
        </div>

        <!-- 로그인 폼 -->
        <div class="login-body">
            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user-circle"></i> 관리자 아이디
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-control" 
                            placeholder="아이디를 입력하세요"
                            value="admin"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> 비밀번호
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="비밀번호를 입력하세요"
                            value="admin1234"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">로그인 상태 유지 (30분)</label>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span>로그인하기 <i class="fas fa-arrow-right"></i></span>
                </button>
            </form>
        </div>

        <!-- 푸터 -->
        <div class="login-footer">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> 
                <span>메인 사이트로 돌아가기</span>
            </a>
        </div>
    </div>

    <!-- admin-auth.js 로드 -->
    <script src="js/admin-auth.js"></script>
    
    <!-- 로그인 처리 스크립트 -->
    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // 알림 표시 함수
        function showAlert(message, type = 'danger') {
            alertBox.className = `alert alert-${type} show`;
            alertBox.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            
            // 자동 숨김 (에러만)
            if (type === 'danger') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 5000);
            }
        }

        // 로그인 처리
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const remember = document.getElementById('remember').checked;

            // 입력 검증
            if (!username) {
                showAlert('아이디를 입력해주세요.');
                usernameInput.focus();
                return;
            }

            if (!password) {
                showAlert('비밀번호를 입력해주세요.');
                passwordInput.focus();
                return;
            }

            // 로딩 상태
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span><span>로그인 중...</span>';

            // admin-auth.js의 adminLogin 함수 호출
            setTimeout(() => {
                try {
                    const result = adminLogin(username, password);

                    if (result.success) {
                        // 로그인 성공
                        showAlert('✅ 로그인 성공! 관리자 페이지로 이동합니다...', 'success');
                        
                        // remember 설정
                        if (remember) {
                            localStorage.setItem('adminRememberMe', 'true');
                        } else {
                            localStorage.removeItem('adminRememberMe');
                        }

                        // 관리자 페이지로 이동
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        // 로그인 실패
                        showAlert('❌ ' + result.message);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>로그인하기 <i class="fas fa-arrow-right"></i></span>';
                        
                        // 입력 필드 초기화 (비밀번호만)
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showAlert('로그인 처리 중 오류가 발생했습니다. admin-auth.js 파일을 확인해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>로그인하기 <i class="fas fa-arrow-right"></i></span>';
                }
            }, 500); // 로딩 효과를 위한 짧은 딜레이
        });

        // 페이지 로드 시: 이미 로그인된 경우 체크
        window.addEventListener('DOMContentLoaded', function() {
            if (isAdminLoggedIn()) {
                const currentAdmin = getCurrentAdmin();
                showAlert(`이미 로그인되어 있습니다. (${currentAdmin.name}) 관리자 페이지로 이동합니다...`, 'success');
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            }
        });

        // Enter 키 지원
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        console.log('✅ 관리자 로그인 페이지 로드 완료');
        console.log('📌 테스트 계정: admin / admin1234');
    </script>
</body>
</html>
