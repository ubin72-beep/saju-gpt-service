<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.9375rem;
            opacity: 0.9;
        }

        .login-body {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #2c3e50;
            font-size: 0.9375rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.125rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #c41e3a;
            box-shadow: 0 0 0 4px rgba(196,30,58,0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9375rem;
            color: #6b7280;
            cursor: pointer;
            margin: 0;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.0625rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(196,30,58,0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .login-footer a {
            color: #c41e3a;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-footer a:hover {
            color: #a01830;
            text-decoration: underline;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .alert-danger {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
            }
            
            .login-header {
                padding: 2rem 1.5rem;
            }
            
            .login-body {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-shield-halved"></i>
            <h1>관리자 로그인</h1>
            <p>AI 사주 천년지기</p>
        </div>

        <div class="login-body">
            <div id="alertBox" class="alert"></div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            class="form-control" 
                            placeholder="관리자 아이디를 입력하세요"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="form-control" 
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">로그인 상태 유지</label>
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>로그인</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> 홈으로 돌아가기
            </a>
        </div>
    </div>

    <script>
        // 환경 설정 (실제 배포 시 환경 변수로 관리)
        const API_CONFIG = {
            // 개발 환경
            dev: {
                baseURL: 'http://localhost:3000',
                apiEndpoint: '/api/admin/login'
            },
            // 프로덕션 환경
            prod: {
                baseURL: 'https://api.aisaju1000.com',
                apiEndpoint: '/api/admin/login'
            }
        };

        // 현재 환경 (실제로는 환경 변수로 설정)
        const CURRENT_ENV = window.location.hostname === 'localhost' ? 'dev' : 'prod';
        const API = API_CONFIG[CURRENT_ENV];

        // 로그인 시도 횟수 제한
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 15 * 60 * 1000; // 15분

        // 페이지 로드 시 잠금 상태 확인
        document.addEventListener('DOMContentLoaded', function() {
            checkLockout();
            
            // 이미 로그인되어 있는지 확인
            const token = getAuthToken();
            if (token && validateToken(token)) {
                window.location.href = 'admin.html';
            }
        });

        // 로그인 폼 제출
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 잠금 상태 확인
            if (checkLockout()) {
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 입력 검증
            if (!username || !password) {
                showAlert('아이디와 비밀번호를 입력해주세요.', 'danger');
                return;
            }

            // 보안: 최소 길이 체크
            if (password.length < 8) {
                showAlert('비밀번호는 최소 8자 이상이어야 합니다.', 'warning');
                return;
            }

            // 로그인 처리
            await handleLogin(username, password, remember);
        });

        // 로그인 처리 함수
        async function handleLogin(username, password, remember) {
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('span');
            const btnIcon = loginBtn.querySelector('i');
            
            try {
                // 버튼 비활성화 및 로딩 표시
                loginBtn.disabled = true;
                btnIcon.className = 'loading-spinner';
                btnText.textContent = '로그인 중...';

                // 백엔드 API 호출
                const response = await fetch(`${API.baseURL}${API.apiEndpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // 로그인 성공
                    loginAttempts = 0;
                    localStorage.removeItem('loginAttempts');
                    localStorage.removeItem('lockoutUntil');

                    // JWT 토큰 저장
                    const storage = remember ? localStorage : sessionStorage;
                    storage.setItem('adminToken', data.token);
                    storage.setItem('adminUser', JSON.stringify(data.user));

                    showAlert('로그인 성공! 관리자 페이지로 이동합니다.', 'success');

                    // 2초 후 관리자 페이지로 이동
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 2000);

                } else {
                    // 로그인 실패
                    handleLoginFailure(data.message || '로그인에 실패했습니다.');
                }

            } catch (error) {
                console.error('Login error:', error);
                
                // 네트워크 오류 또는 서버 오류
                if (error.message.includes('Failed to fetch')) {
                    showAlert('서버에 연결할 수 없습니다. 네트워크 연결을 확인해주세요.', 'danger');
                } else {
                    // 백엔드 API가 없을 경우 임시 인증 (개발 환경)
                    if (CURRENT_ENV === 'dev') {
                        handleDemoLogin(username, password, remember);
                    } else {
                        showAlert('로그인 처리 중 오류가 발생했습니다.', 'danger');
                    }
                }

            } finally {
                // 버튼 복원
                loginBtn.disabled = false;
                btnIcon.className = 'fas fa-sign-in-alt';
                btnText.textContent = '로그인';
            }
        }

        // 데모 로그인 (개발 환경용)
        function handleDemoLogin(username, password, remember) {
            // 임시 관리자 계정 (실제로는 백엔드에서 처리)
            const DEMO_ADMIN = {
                username: 'admin',
                password: 'Admin@2026!',  // 변경된 강력한 비밀번호
            };

            if (username === DEMO_ADMIN.username && password === DEMO_ADMIN.password) {
                loginAttempts = 0;
                localStorage.removeItem('loginAttempts');
                localStorage.removeItem('lockoutUntil');

                // 임시 토큰 생성
                const demoToken = btoa(JSON.stringify({
                    username: username,
                    role: 'admin',
                    exp: Date.now() + (remember ? 30 * 24 * 60 * 60 * 1000 : 24 * 60 * 60 * 1000)
                }));

                const storage = remember ? localStorage : sessionStorage;
                storage.setItem('adminToken', demoToken);
                storage.setItem('adminUser', JSON.stringify({
                    id: 1,
                    username: username,
                    role: 'admin'
                }));

                showAlert('로그인 성공! (개발 모드)', 'success');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);

            } else {
                handleLoginFailure('아이디 또는 비밀번호가 올바르지 않습니다.');
            }
        }

        // 로그인 실패 처리
        function handleLoginFailure(message) {
            loginAttempts++;
            localStorage.setItem('loginAttempts', loginAttempts);

            const remainingAttempts = MAX_ATTEMPTS - loginAttempts;

            if (loginAttempts >= MAX_ATTEMPTS) {
                // 계정 잠금
                const lockoutUntil = Date.now() + LOCKOUT_TIME;
                localStorage.setItem('lockoutUntil', lockoutUntil);
                showAlert(`너무 많은 로그인 시도로 인해 15분간 로그인이 제한됩니다.`, 'danger');
            } else {
                showAlert(`${message} (남은 시도: ${remainingAttempts}회)`, 'danger');
            }
        }

        // 잠금 상태 확인
        function checkLockout() {
            const lockoutUntil = localStorage.getItem('lockoutUntil');
            
            if (lockoutUntil) {
                const remaining = parseInt(lockoutUntil) - Date.now();
                
                if (remaining > 0) {
                    const minutes = Math.ceil(remaining / 60000);
                    showAlert(`로그인이 제한되었습니다. ${minutes}분 후에 다시 시도해주세요.`, 'warning');
                    document.getElementById('loginBtn').disabled = true;
                    return true;
                } else {
                    // 잠금 해제
                    localStorage.removeItem('lockoutUntil');
                    localStorage.removeItem('loginAttempts');
                    loginAttempts = 0;
                }
            }
            
            return false;
        }

        // 토큰 가져오기
        function getAuthToken() {
            return localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
        }

        // 토큰 검증 (간단한 검증)
        function validateToken(token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1] || token));
                return payload.exp > Date.now();
            } catch {
                return false;
            }
        }

        // 알림 표시
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type} show`;
            alertBox.textContent = message;

            // 5초 후 자동 숨김
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // 전역 에러 핸들러
        window.addEventListener('error', function(e) {
            if (e.filename && !e.filename.includes('aisaju1000.com')) {
                e.preventDefault();
                return true;
            }
        }, true);

        // 보안: 비밀번호 입력 필드 붙여넣기 방지 (선택사항)
        // document.getElementById('password').addEventListener('paste', function(e) {
        //     e.preventDefault();
        //     showAlert('보안을 위해 비밀번호 붙여넣기가 제한됩니다.', 'warning');
        // });
    </script>
</body>
</html>
