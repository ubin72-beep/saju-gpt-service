<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - AI 사주 천년지기</title>
    
    <!-- External Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== CSS Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* ===== Login Container ===== */
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ===== Header ===== */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        /* ===== Tabs ===== */
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 5px;
            border-radius: 10px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 10px rgba(102,126,234,0.2);
        }
        
        /* ===== Form ===== */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        /* ===== Checkbox ===== */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        /* ===== Form Footer Links ===== */
        .form-footer-links {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        /* ===== Buttons ===== */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        /* ===== Social Login ===== */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .btn-social {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-social:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn-social i {
            font-size: 18px;
        }
        
        .btn-google { color: #DB4437; }
        .btn-kakao { color: #FEE500; background: #FEE500 !important; }
        
        /* ===== Footer ===== */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }
        
        .back-home {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-home:hover {
            text-decoration: underline;
        }
        
        /* ===== Alert Message ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <h1>🔮 AI 사주 천년지기</h1>
            <p class="login-subtitle">정통 명리학과 AI 기술의 만남</p>
        </div>
        
        <!-- Alert Message -->
        <div id="alertMessage" class="alert"></div>
        
        <!-- Tabs -->
        <div class="login-tabs">
            <button class="tab-btn active" data-tab="login">로그인</button>
            <button class="tab-btn" data-tab="signup">회원가입</button>
        </div>
        
        <!-- Login Form -->
        <div id="loginTab" class="tab-content active">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">이메일</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>로그인 상태 유지</span>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> 로그인
                </button>
            </form>
            
            <div class="form-footer-links">
                <a href="#" class="forgot-password" id="forgotPasswordLink">비밀번호 찾기</a>
            </div>
        </div>
        
        <!-- Signup Form -->
        <div id="signupTab" class="tab-content">
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">이름</label>
                    <input type="text" id="signupName" placeholder="홍길동" required>
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">이메일</label>
                    <input type="email" id="signupEmail" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">비밀번호</label>
                    <input type="password" id="signupPassword" placeholder="8자 이상 입력" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPasswordConfirm">비밀번호 확인</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 재입력" required>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-user-plus"></i> 회원가입
                </button>
            </form>
            
            <div class="form-footer-links">
                <a href="#" class="forgot-password" id="forgotPasswordLinkSignup">비밀번호 찾기</a>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="login-footer">
            <a href="index.html" class="back-home">
                <i class="fas fa-arrow-left"></i> 홈으로 돌아가기
            </a>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        'use strict';
        
        // ===== URL 파라미터에서 이메일 가져오기 =====
        const urlParams = new URLSearchParams(window.location.search);
        const emailFromUrl = urlParams.get('email');
        if (emailFromUrl) {
            document.getElementById('loginEmail').value = emailFromUrl;
        }
        
        // ===== URL 파라미터로 탭 전환 =====
        const tabParam = urlParams.get('tab');
        if (tabParam === 'signup') {
            // 회원가입 탭으로 전환
            document.querySelector('[data-tab="login"]').classList.remove('active');
            document.querySelector('[data-tab="signup"]').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('signupTab').classList.add('active');
        }
        
        // ===== Tab Switching =====
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');
                
                // Remove active class from all
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // Add active class to current
                button.classList.add('active');
                document.getElementById(`${tabName}Tab`).classList.add('active');
                
                // Clear alert message
                hideAlert();
            });
        });
        
        // ===== Alert Functions =====
        function showAlert(message, type = 'success') {
            const alertElement = document.getElementById('alertMessage');
            alertElement.textContent = message;
            alertElement.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                hideAlert();
            }, 5000);
        }
        
        function hideAlert() {
            const alertElement = document.getElementById('alertMessage');
            alertElement.classList.remove('show');
        }
        
        // ===== Login Form Handler =====
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Basic validation
            if (!email || !password) {
                showAlert('이메일과 비밀번호를 입력해주세요.', 'error');
                return;
            }
            
            try {
                // LocalStorage에서 사용자 찾기
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    showAlert('✅ 로그인 성공! 홈페이지로 이동합니다...', 'success');
                    
                    // 로그인 정보 저장
                    const loginInfo = {
                        id: user.id,
                        email: user.email,
                        name: user.name,
                        birthDate: user.birthDate,
                        loginTime: new Date().toISOString()
                    };
                    
                    localStorage.setItem('currentUser', JSON.stringify(loginInfo));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Remember me 처리
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    }
                    
                    // AI 상담 질문 개수 설정 (회원가입 시 기본값)
                    if (!localStorage.getItem('remainingQuestions')) {
                        localStorage.setItem('remainingQuestions', user.remainingQuestions || 5);
                    }
                    
                    console.log('✅ 로그인 성공:', loginInfo);
                    
                    // 홈페이지로 이동
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showAlert('❌ 이메일 또는 비밀번호가 일치하지 않습니다.', 'error');
                }
            } catch (error) {
                console.error('로그인 에러:', error);
                showAlert('❌ 로그인 중 오류가 발생했습니다: ' + error.message, 'error');
            }
        });
        
        // ===== Signup Form Handler =====
        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            
            // Validation
            if (!name || !email || !password || !passwordConfirm) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }
            
            if (password.length < 8) {
                showAlert('비밀번호는 8자 이상이어야 합니다.', 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                showAlert('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
            
            try {
                // LocalStorage에 사용자 저장
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // 이메일 중복 체크
                const existingUser = users.find(u => u.email === email);
                if (existingUser) {
                    showAlert('⚠️ 이미 가입된 이메일입니다.', 'error');
                    return;
                }
                
                // 새 사용자 추가
                const newUser = {
                    id: Date.now().toString(),
                    name,
                    email,
                    password, // 실제로는 해시화 필요
                    signupDate: new Date().toISOString(),
                    remainingQuestions: 5
                };
                
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                showAlert('✅ 회원가입 성공! 로그인 페이지로 이동합니다...', 'success');
                
                console.log('✅ 회원가입 성공:', newUser);
                
                // 로그인 탭으로 전환
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginEmail').value = email;
                }, 2000);
            } catch (error) {
                console.error('회원가입 에러:', error);
                showAlert('❌ 회원가입 중 오류가 발생했습니다: ' + error.message, 'error');
            }
        });
        
        // ===== Social Login =====
        document.querySelectorAll('.btn-social').forEach(button => {
            button.addEventListener('click', () => {
                const provider = button.classList.contains('btn-google') ? 'Google' : 'Kakao';
                showAlert(`${provider} 소셜 로그인은 준비 중입니다.`, 'error');
            });
        });
        
        // ===== 비밀번호 찾기 =====
        const forgotPasswordLinks = document.querySelectorAll('.forgot-password');
        forgotPasswordLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const email = prompt('가입하신 이메일 주소를 입력해주세요:');
                
                if (!email) {
                    return;
                }
                
                try {
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const user = users.find(u => u.email === email);
                    
                    if (user) {
                        showAlert(`✅ 비밀번호가 이메일로 전송되었습니다.\n임시 비밀번호: ${user.password.substring(0, 4)}****\n(실제로는 이메일로 전송됩니다)`, 'success');
                    } else {
                        showAlert('❌ 등록되지 않은 이메일입니다.', 'error');
                    }
                } catch (error) {
                    showAlert('❌ 오류가 발생했습니다: ' + error.message, 'error');
                }
            });
        });
        
        // ===== Check if already logged in =====
        if (localStorage.getItem('isLoggedIn') === 'true') {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            if (currentUser.name) {
                showAlert(`${currentUser.name}님은 이미 로그인되어 있습니다. 홈페이지로 이동합니다.`, 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
        
        // ===== Global Error Handler =====
        window.addEventListener('error', function(e) {
            // aisaju1000.com 외의 스크립트 에러 무시
            if (e.filename && !e.filename.includes('aisaju1000.com')) {
                e.preventDefault();
                return false;
            }
        });
        
        console.log('✅ 로그인 페이지 로드 완료 (LocalStorage 기반 인증)');
    </script>
</body>
</html>
