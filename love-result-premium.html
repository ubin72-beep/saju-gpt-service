<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤 연애운 프리미엄 분석 결과 - AI 사주 천년지기</title>
    <meta name="description" content="사주 기반 12개월 연애운 그래프, 이상형 분석, 최적 타이밍 제공">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .premium-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            margin: 1rem 0;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .user-info {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
            text-align: center;
        }

        .user-info h2 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .user-info .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .user-info .info-item {
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .user-info .info-item strong {
            display: block;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .section {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            font-size: 2rem;
        }

        /* 12개월 연애운 그래프 */
        .chart-container {
            margin: 2rem 0;
            height: 400px;
        }

        /* 이상형 분석 */
        .ideal-type {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .ideal-card {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ideal-card h4 {
            color: #5a189a;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ideal-card p {
            color: #333;
            line-height: 1.8;
            font-size: 1rem;
        }

        /* 연애 타이밍 */
        .timing-list {
            display: grid;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .timing-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .timing-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(50%, -50%);
        }

        .timing-card .period {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d6336c;
            margin-bottom: 0.5rem;
        }

        .timing-card .probability {
            display: inline-block;
            background: white;
            color: #d6336c;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .timing-card .reason {
            color: #333;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* 연애 스타일 */
        .love-style {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 2rem;
            border-radius: 15px;
            color: white;
            margin-top: 1.5rem;
        }

        .love-style h3 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .love-style .traits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .love-style .trait-box {
            background: rgba(255,255,255,0.2);
            padding: 1.5rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .love-style .trait-box h4 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .love-style .trait-box ul {
            list-style: none;
        }

        .love-style .trait-box li {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .love-style .trait-box li::before {
            content: '💖';
        }

        .love-style .advice {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* CTA 버튼 */
        .cta-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            margin-top: 2rem;
        }

        .cta-section h3 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .cta-section p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn-cta {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* 로딩 */
        .loading {
            text-align: center;
            color: white;
            padding: 4rem 2rem;
        }

        .loading .spinner {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .section {
                padding: 1.5rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .chart-container {
                height: 300px;
            }

            .user-info .info-grid {
                grid-template-columns: 1fr;
            }

            .love-style .traits {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <h2>프리미엄 연애운 분석 중...</h2>
        <p>사주 기반 맞춤 분석을 생성하고 있습니다.</p>
    </div>

    <div id="content" class="container" style="display: none;">
        <div class="header">
            <h1>💕 맞춤 연애운 프리미엄 분석</h1>
            <p class="subtitle">사주 기반 12개월 연애운 · 이상형 · 최적 타이밍</p>
            <span class="premium-badge">⭐ PREMIUM ⭐</span>
        </div>

        <div class="user-info">
            <h2 id="userName"></h2>
            <div class="info-grid">
                <div class="info-item">
                    <strong>생년월일</strong>
                    <span id="userBirth"></span>
                </div>
                <div class="info-item">
                    <strong>성별</strong>
                    <span id="userGender"></span>
                </div>
                <div class="info-item">
                    <strong>일간 (日干)</strong>
                    <span id="userDayMaster"></span>
                </div>
                <div class="info-item">
                    <strong>오행</strong>
                    <span id="userElement"></span>
                </div>
                <div class="info-item">
                    <strong>연애 타입</strong>
                    <span id="userLoveType"></span>
                </div>
            </div>
        </div>

        <!-- 12개월 연애운 그래프 -->
        <div class="section">
            <h3 class="section-title">
                <i class="fas fa-chart-line"></i>
                2026년 12개월 연애운 그래프
            </h3>
            <div class="chart-container">
                <canvas id="loveChart"></canvas>
            </div>
        </div>

        <!-- 이상형 분석 -->
        <div class="section">
            <h3 class="section-title">
                <i class="fas fa-heart"></i>
                나의 이상형 분석
            </h3>
            <div id="idealTypeContent" class="ideal-type"></div>
        </div>

        <!-- 연애 타이밍 -->
        <div class="section">
            <h3 class="section-title">
                <i class="fas fa-calendar-check"></i>
                2026년 최적의 연애 타이밍 TOP 3
            </h3>
            <div id="timingContent" class="timing-list"></div>
        </div>

        <!-- 연애 스타일 -->
        <div class="section">
            <h3 class="section-title">
                <i class="fas fa-user-heart"></i>
                나의 연애 스타일 분석
            </h3>
            <div id="styleContent"></div>
        </div>

        <!-- CTA -->
        <div class="cta-section">
            <h3>🎁 더 많은 프리미엄 서비스</h3>
            <p>사주 기반 종합 운세, 직업 적성, 재물운, 택일까지!</p>
            <a href="/result.html" class="btn-cta">무료 사주 분석하기</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/love-premium-engine.js"></script>
    <script>
        // URL 파라미터 추출
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                name: params.get('name') || '고객',
                birth: params.get('birth') || '1990-01-01',
                gender: params.get('gender') || 'male',
                dayMaster: params.get('dayMaster') || '갑'
            };
        }

        // 로딩 완료 후 실행
        window.addEventListener('DOMContentLoaded', async () => {
            // 엔진 로드 확인
            if (typeof LovePremiumEngine === 'undefined') {
                alert('시스템 오류가 발생했습니다. 페이지를 새로고침해주세요.');
                return;
            }

            const params = getQueryParams();
            const engine = new LovePremiumEngine();

            // 전체 분석 생성
            const analysis = engine.generateFullAnalysis(
                params.name,
                params.birth,
                params.gender,
                params.dayMaster
            );

            // 1초 후 로딩 종료
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // 사용자 정보 표시
                document.getElementById('userName').textContent = `${analysis.name}님의 연애운`;
                document.getElementById('userBirth').textContent = analysis.birthDate;
                document.getElementById('userGender').textContent = analysis.gender === 'male' ? '남성' : '여성';
                document.getElementById('userDayMaster').textContent = `${analysis.dayMaster}일간`;
                document.getElementById('userElement').textContent = `${analysis.element}(${analysis.dayMaster})`;
                document.getElementById('userLoveType').textContent = analysis.loveType;

                // 12개월 그래프 렌더링
                renderLoveChart(analysis.monthlyFortune);

                // 이상형 분석 렌더링
                renderIdealType(analysis.idealType);

                // 연애 타이밍 렌더링
                renderTiming(analysis.timing);

                // 연애 스타일 렌더링
                renderStyle(analysis.style);

                // 부드러운 스크롤
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 1500);
        });

        // 12개월 연애운 그래프 렌더링
        function renderLoveChart(monthlyData) {
            const ctx = document.getElementById('loveChart').getContext('2d');
            const labels = monthlyData.map(m => m.month);
            const scores = monthlyData.map(m => m.score);
            const colors = monthlyData.map(m => m.color);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '연애운 점수',
                        data: scores,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: colors,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const index = context.dataIndex;
                                    const data = monthlyData[index];
                                    return [
                                        `점수: ${data.score}점`,
                                        `상태: ${data.status}`,
                                        `조언: ${data.advice}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 60,
                            max: 100,
                            ticks: {
                                stepSize: 10
                            }
                        }
                    }
                }
            });
        }

        // 이상형 분석 렌더링
        function renderIdealType(idealType) {
            const container = document.getElementById('idealTypeContent');
            container.innerHTML = `
                <div class="ideal-card">
                    <h4><i class="fas fa-star"></i> 성격</h4>
                    <p>${idealType.personality}</p>
                </div>
                <div class="ideal-card">
                    <h4><i class="fas fa-user"></i> 외모 스타일</h4>
                    <p>${idealType.appearance}</p>
                </div>
                <div class="ideal-card">
                    <h4><i class="fas fa-heart-circle-check"></i> 궁합</h4>
                    <p>${idealType.compatibility}</p>
                </div>
                <div class="ideal-card">
                    <h4><i class="fas fa-lightbulb"></i> 조언</h4>
                    <p>${idealType.advice}</p>
                </div>
            `;
        }

        // 연애 타이밍 렌더링
        function renderTiming(timing) {
            const container = document.getElementById('timingContent');
            container.innerHTML = timing.map((t, index) => `
                <div class="timing-card">
                    <div class="period">🎯 ${index + 1}순위: ${t.period}</div>
                    <div class="probability">성공 확률 ${t.probability}%</div>
                    <div class="reason">${t.reason}</div>
                </div>
            `).join('');
        }

        // 연애 스타일 렌더링
        function renderStyle(style) {
            const container = document.getElementById('styleContent');
            container.innerHTML = `
                <div class="love-style">
                    <h3>${style.type}</h3>
                    <p style="font-size: 1.2rem; opacity: 0.9;">종합 궁합 점수: ${style.compatibility_score}점</p>
                    <div class="traits">
                        <div class="trait-box">
                            <h4>💪 장점</h4>
                            <ul>
                                ${style.strength.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="trait-box">
                            <h4>⚠️ 주의점</h4>
                            <ul>
                                ${style.weakness.map(w => `<li>${w}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                    <div class="advice">
                        <strong>💡 연애 조언:</strong><br>
                        ${style.advice}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
