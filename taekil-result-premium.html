<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길일 분석 결과 - AI 사주 천년지기 프리미엄</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/modal.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 헤더 */
        .result-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .result-header h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.5rem;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .result-header .subtitle {
            font-size: 1.1rem;
            color: #2a2a3e;
            opacity: 0.8;
        }

        .user-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .user-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: #1a1a2e;
        }

        .user-info-item i {
            color: #d4af37;
        }

        /* 결과 섹션 */
        .result-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .section-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            color: #d4af37;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            font-size: 1.5rem;
        }

        /* 최고 길일 카드 */
        .best-date-card {
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 50%, #d4af37 100%);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
        }

        .best-date-card::before {
            content: '⭐';
            position: absolute;
            font-size: 200px;
            opacity: 0.1;
            top: -50px;
            right: -50px;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .best-date-card .date {
            font-family: 'Noto Serif KR', serif;
            font-size: 3rem;
            color: #1a1a2e;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .best-date-card .lunar-date {
            font-size: 1.2rem;
            color: #2a2a3e;
            margin-bottom: 15px;
        }

        .best-date-card .score {
            display: inline-block;
            background: #1a1a2e;
            color: #d4af37;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .best-date-card .reason {
            font-size: 1.1rem;
            color: #1a1a2e;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 시간대 추천 */
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .time-slot-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(244, 229, 161, 0.1) 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .time-slot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
        }

        .time-slot-card .rank {
            display: inline-block;
            background: #d4af37;
            color: #1a1a2e;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .time-slot-card .time {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.5rem;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .time-slot-card .description {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* 방향 풍수 */
        .direction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .direction-card {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .direction-card.lucky {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .direction-card.caution {
            border-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .direction-card.avoid {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .direction-card .direction {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .direction-card .label {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .direction-card.lucky .label {
            color: #4caf50;
        }

        .direction-card.caution .label {
            color: #ff9800;
        }

        .direction-card.avoid .label {
            color: #f44336;
        }

        .direction-card .description {
            font-size: 0.9rem;
            color: #b0b0b0;
            line-height: 1.5;
        }

        /* 주의사항 */
        .caution-list {
            list-style: none;
            padding: 0;
        }

        .caution-list li {
            background: rgba(244, 67, 54, 0.1);
            border-left: 4px solid #f44336;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .caution-list li::before {
            content: '⚠️ ';
            margin-right: 8px;
        }

        /* 대안 날짜 */
        .alternative-dates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .alt-date-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .alt-date-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .alt-date-card .rank-badge {
            display: inline-block;
            background: #d4af37;
            color: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .alt-date-card .date {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .alt-date-card .lunar-date {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 12px;
        }

        .alt-date-card .score {
            display: inline-block;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .alt-date-card .reason {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.7;
        }

        /* 체크리스트 */
        .checklist {
            list-style: none;
            padding: 0;
        }

        .checklist li {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.6;
            position: relative;
            padding-left: 50px;
        }

        .checklist li::before {
            content: '✓';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: #d4af37;
            color: #1a1a2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* 흉일 경고 */
        .bad-dates {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
        }

        .bad-dates h3 {
            color: #f44336;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bad-dates h3 i {
            font-size: 1.5rem;
        }

        .bad-date-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .bad-date-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .bad-date-item .date {
            font-size: 1.1rem;
            color: #f44336;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bad-date-item .reason {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        /* PDF 다운로드 버튼 */
        .download-section {
            text-align: center;
            margin: 40px 0;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 50%, #d4af37 100%);
            color: #1a1a2e;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
        }

        .download-btn i {
            margin-right: 10px;
        }

        /* 로딩 애니메이션 */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }

        .loading .spinner {
            border: 5px solid rgba(212, 175, 55, 0.2);
            border-top: 5px solid #d4af37;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 1.2rem;
            color: #d4af37;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .result-header h1 {
                font-size: 1.8rem;
            }

            .best-date-card .date {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .time-slots,
            .direction-grid,
            .alternative-dates {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로딩 화면 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>최적의 길일을 분석하고 있습니다...</p>
        </div>

        <!-- 결과 컨테이너 (초기에는 숨김) -->
        <div id="resultContainer" style="display: none;">
            <!-- 헤더 -->
            <div class="result-header">
                <h1>🌟 길일 분석 결과</h1>
                <p class="subtitle">사주 맞춤 프리미엄 길일 분석</p>
                <div class="user-info">
                    <div class="user-info-item">
                        <i class="fas fa-user"></i>
                        <span id="userName"></span>
                    </div>
                    <div class="user-info-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="userBirth"></span>
                    </div>
                    <div class="user-info-item">
                        <i class="fas fa-yin-yang"></i>
                        <span id="userDayMaster"></span>
                    </div>
                    <div class="user-info-item">
                        <i class="fas fa-home"></i>
                        <span id="eventType"></span>
                    </div>
                </div>
            </div>

            <!-- 최고 길일 -->
            <div class="result-section">
                <div class="best-date-card" id="bestDateCard">
                    <!-- JavaScript로 채워집니다 -->
                </div>
            </div>

            <!-- 최적 시간대 -->
            <div class="result-section">
                <h2 class="section-title">
                    <i class="fas fa-clock"></i>
                    최적 시간대 (시진별 분석)
                </h2>
                <div class="time-slots" id="timeSlots">
                    <!-- JavaScript로 채워집니다 -->
                </div>
            </div>

            <!-- 방향 풍수 -->
            <div class="result-section">
                <h2 class="section-title">
                    <i class="fas fa-compass"></i>
                    방향별 풍수 분석
                </h2>
                <div class="direction-grid" id="directionGrid">
                    <!-- JavaScript로 채워집니다 -->
                </div>
            </div>

            <!-- 주의사항 -->
            <div class="result-section">
                <h2 class="section-title">
                    <i class="fas fa-exclamation-triangle"></i>
                    주의사항 (필독)
                </h2>
                <ul class="caution-list" id="cautionList">
                    <!-- JavaScript로 채워집니다 -->
                </ul>
            </div>

            <!-- 대안 날짜 -->
            <div class="result-section">
                <h2 class="section-title">
                    <i class="fas fa-calendar-check"></i>
                    대안 길일 TOP 3
                </h2>
                <div class="alternative-dates" id="alternativeDates">
                    <!-- JavaScript로 채워집니다 -->
                </div>
            </div>

            <!-- 피해야 할 날 (흉일) -->
            <div class="result-section">
                <div class="bad-dates">
                    <h3>
                        <i class="fas fa-ban"></i>
                        피해야 할 날 (흉일)
                    </h3>
                    <p style="margin-bottom: 15px; color: #e0e0e0;">
                        아래 날짜는 당신의 사주와 상충하여 피하시는 것이 좋습니다.
                    </p>
                    <div class="bad-date-list" id="badDateList">
                        <!-- JavaScript로 채워집니다 -->
                    </div>
                </div>
            </div>

            <!-- 체크리스트 -->
            <div class="result-section">
                <h2 class="section-title">
                    <i class="fas fa-tasks"></i>
                    <span id="checklistTitle"></span> 체크리스트
                </h2>
                <ul class="checklist" id="checklist">
                    <!-- JavaScript로 채워집니다 -->
                </ul>
            </div>

            <!-- PDF 다운로드 -->
            <div class="download-section">
                <a href="#" class="download-btn" id="downloadBtn">
                    <i class="fas fa-file-pdf"></i>
                    전체 결과 PDF 다운로드
                </a>
                <p style="margin-top: 15px; color: #b0b0b0; font-size: 0.9rem;">
                    * 프리미엄 회원 전용 기능입니다
                </p>
            </div>
        </div>
    </div>

    <!-- 엔진 로드 -->
    <script src="/js/lunar.min.js"></script>
    <script src="/js/taekil-premium-engine.js"></script>
    
    <script>
        // URL 파라미터에서 데이터 가져오기
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                name: params.get('name') || '사용자',
                birth: params.get('birth') || '1990-01-01',
                calendar: params.get('calendar') || 'solar',
                dayMaster: params.get('dayMaster') || '갑',
                eventType: params.get('eventType') || 'moving',
                targetMonth: params.get('targetMonth') || '2026-02'
            };
        }

        // 메인 함수
        async function displayResult() {
            const params = getQueryParams();
            const engine = new TaekilPremiumEngine();

            // 로딩 시작
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';

            // 1.5초 로딩 (실제로는 빠르지만 프리미엄 느낌 연출)
            await new Promise(resolve => setTimeout(resolve, 1500));

            // 헤더 정보 채우기
            document.getElementById('userName').textContent = params.name;
            document.getElementById('userBirth').textContent = params.birth;
            document.getElementById('userDayMaster').textContent = `${params.dayMaster}일주`;
            document.getElementById('eventType').textContent = params.eventType === 'moving' ? '이사' : '결혼';

            // 길일 분석
            const luckyDates = engine.getLuckyDates(
                params.dayMaster,
                params.eventType,
                params.targetMonth
            );

            if (luckyDates.length === 0) {
                alert('해당 기간에 적합한 길일을 찾을 수 없습니다.');
                return;
            }

            const bestDate = luckyDates[0];

            // 최고 길일 카드
            const bestDateCard = document.getElementById('bestDateCard');
            bestDateCard.innerHTML = `
                <div class="date">${bestDate.date}</div>
                <div class="lunar-date">음력 ${bestDate.lunar.year}년 ${bestDate.lunar.month}월 ${bestDate.lunar.day}일</div>
                <div class="score">길일 지수: ${bestDate.score}점</div>
                <div class="reason">${bestDate.reason}</div>
            `;

            // 최적 시간대
            const timeSlots = engine.getBestTimeSlots(bestDate.date, params.dayMaster);
            const timeSlotsContainer = document.getElementById('timeSlots');
            timeSlotsContainer.innerHTML = timeSlots.map((slot, index) => `
                <div class="time-slot-card">
                    <div class="rank">${index + 1}순위</div>
                    <div class="time">${slot.time}</div>
                    <div class="description">${slot.description}</div>
                </div>
            `).join('');

            // 방향 풍수
            const directions = engine.getDirectionAdvice(bestDate.date, params.dayMaster);
            const directionGrid = document.getElementById('directionGrid');
            directionGrid.innerHTML = directions.map(dir => `
                <div class="direction-card ${dir.status}">
                    <div class="direction">${dir.direction}</div>
                    <div class="label">${dir.label}</div>
                    <div class="description">${dir.description}</div>
                </div>
            `).join('');

            // 주의사항
            const cautionList = document.getElementById('cautionList');
            cautionList.innerHTML = bestDate.cautions.map(caution => `
                <li>${caution}</li>
            `).join('');

            // 대안 날짜
            const alternativeDates = document.getElementById('alternativeDates');
            alternativeDates.innerHTML = luckyDates.slice(1, 4).map((date, index) => `
                <div class="alt-date-card">
                    <div class="rank-badge">${index + 2}순위</div>
                    <div class="date">${date.date}</div>
                    <div class="lunar-date">음력 ${date.lunar.year}년 ${date.lunar.month}월 ${date.lunar.day}일</div>
                    <div class="score">길일 지수: ${date.score}점</div>
                    <div class="reason">${date.reason}</div>
                </div>
            `).join('');

            // 흉일
            const badDates = engine.getBadDates(params.dayMaster, params.eventType, params.targetMonth);
            const badDateList = document.getElementById('badDateList');
            badDateList.innerHTML = badDates.map(date => `
                <div class="bad-date-item">
                    <div class="date">${date.date}</div>
                    <div class="reason">${date.reason}</div>
                </div>
            `).join('');

            // 체크리스트
            const checklist = engine.getChecklist(params.eventType);
            document.getElementById('checklistTitle').textContent = params.eventType === 'moving' ? '이사' : '결혼';
            const checklistContainer = document.getElementById('checklist');
            checklistContainer.innerHTML = checklist.map(item => `
                <li>${item}</li>
            `).join('');

            // PDF 다운로드 버튼
            document.getElementById('downloadBtn').addEventListener('click', (e) => {
                e.preventDefault();
                alert('PDF 다운로드 기능은 프리미엄 회원 전용입니다.\n\n업그레이드하시면 전체 분석 결과를 PDF로 다운로드하실 수 있습니다.');
                // 실제 구현 시: window.open('/api/generate-taekil-pdf?...');
            });

            // 로딩 종료, 결과 표시
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'block';

            // 부드러운 스크롤
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', displayResult);
    </script>
</body>
</html>
