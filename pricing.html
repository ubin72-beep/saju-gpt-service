<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격표 - AI 사주 천년지기</title>
    <meta name="description" content="AI 사주 천년지기의 모든 서비스 가격을 확인하세요. 무료부터 프리미엄까지!">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #c41e3a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin: 50px 0;
        }
        
        .pricing-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            position: relative;
        }
        
        .pricing-card:hover {
            transform: translateY(-10px);
        }
        
        .pricing-card.best {
            border: 4px solid #FFD700;
            transform: scale(1.05);
        }
        
        .best-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #1a1a1a;
            padding: 8px 24px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
        }
        
        .plan-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        
        .plan-price {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .plan-price.free {
            color: #27ae60;
        }
        
        .plan-price.monthly {
            color: #e74c3c;
        }
        
        .plan-price span {
            font-size: 1.2rem;
            font-weight: 400;
        }
        
        .plan-features {
            list-style: none;
            margin-bottom: 30px;
        }
        
        .plan-features li {
            padding: 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-size: 1rem;
        }
        
        .plan-features li i {
            color: #27ae60;
            font-size: 1.2rem;
        }
        
        .plan-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .plan-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }
        
        .plan-btn.free {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
        }
        
        .plan-btn.free:hover {
            box-shadow: 0 12px 30px rgba(39, 174, 96, 0.6);
        }
        
        .discount {
            background: #ff4444;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .pricing-grid {
                grid-template-columns: 1fr;
            }
            
            .pricing-card.best {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 가격표</h1>
            <p>합리적인 가격으로 만나는 정통 운세 서비스</p>
        </div>
        
        <div class="pricing-grid">
            <!-- 무료 체험 -->
            <div class="pricing-card">
                <div class="plan-name">무료 체험</div>
                <div class="plan-price free">₩0<span>/평생</span></div>
                <ul class="plan-features">
                    <li><i class="fas fa-check-circle"></i> 기본 사주 확인</li>
                    <li><i class="fas fa-check-circle"></i> AI 상담 3회/일</li>
                </ul>
                <button class="plan-btn free" onclick="location.href='index.html'">무료 시작하기</button>
            </div>
            
            <!-- 월간 프리미엄 (BEST) -->
            <div class="pricing-card best">
                <div class="best-badge">BEST</div>
                <div class="plan-name">월간 프리미엄</div>
                <div class="plan-price monthly">₩19,900<span>/월</span></div>
                <ul class="plan-features">
                    <li><i class="fas fa-check-circle"></i> 무료 플랜 모든 기능</li>
                    <li><i class="fas fa-check-circle"></i> AI 상담 무제한</li>
                </ul>
                <button class="plan-btn" onclick="goToPayment('월간 프리미엄', 19900, '무료 플랜 모든 기능 + AI 상담 무제한', 'monthly_premium')">선택하기</button>
            </div>
            
            <!-- 연간 프리미엄 -->
            <div class="pricing-card">
                <div class="plan-name">연간 프리미엄</div>
                <div class="plan-price monthly">
                    <span class="original-price">₩239,000</span>
                    ₩199,000<span>/년</span>
                    <div class="discount">월 ₩16,583 (16% 할인!)</div>
                </div>
                <ul class="plan-features">
                    <li><i class="fas fa-check-circle"></i> 월간 플랜 모든 기능</li>
                    <li><i class="fas fa-check-circle"></i> 전문가 우선 지원</li>
                </ul>
                <button class="plan-btn" onclick="goToPayment('연간 프리미엄', 199000, '월간 플랜 모든 기능 + 전문가 우선 지원 + 16% 할인', 'yearly_premium')">선택하기</button>
            </div>
        </div>
        
        <div style="text-align: center;">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> 메인으로 돌아가기
            </a>
        </div>
    </div>
    
    <script>
        // 결제 페이지로 이동
        function goToPayment(serviceName, price, description, type) {
            const params = new URLSearchParams({
                name: serviceName,
                price: price,
                desc: description,
                type: type
            });
            window.location.href = `payment.html?${params.toString()}`;
        }
    </script>
</body>
</html>
