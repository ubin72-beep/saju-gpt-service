<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 사주 천년지기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 네비게이션 로더 -->
    <script src="js/navbar-loader.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .required {
            color: #f5576c;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #f5576c;
        }

        .form-group input.success {
            border-color: #4CAF50;
        }

        .error-message {
            color: #f5576c;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #4CAF50;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-strength {
            height: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #f5576c;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #FFA500;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #4CAF50;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }

        .checkbox-group {
            margin-bottom: 25px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        .checkbox-item a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .checkbox-item a:hover {
            text-decoration: underline;
        }

        .btn-signup {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
        }

        .btn-signup:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .social-signup {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .social-title {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }

        .social-btn:hover {
            border-color: #667eea;
        }

        .social-btn.kakao {
            background: #FEE500;
            border-color: #FEE500;
        }

        .social-btn.kakao:hover {
            background: #FDD835;
        }

        .social-btn.naver {
            background: #03C75A;
            color: white;
            border-color: #03C75A;
        }

        .social-btn.naver:hover {
            background: #02B350;
        }

        .social-btn.google {
            border-color: #e0e0e0;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .signup-container {
                padding: 30px 20px;
            }

            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <div id="navbar-placeholder"></div>
    
    <div class="signup-container">
        <div class="logo">
            <h1>🔮 AI 사주 천년지기</h1>
            <p>회원가입하고 무료 운세 보기</p>
        </div>

        <form id="signupForm">
            <!-- 이메일 -->
            <div class="form-group">
                <label>이메일 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="error-message" id="emailError">유효한 이메일을 입력해주세요.</div>
                <div class="success-message" id="emailSuccess">사용 가능한 이메일입니다.</div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label>비밀번호 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError">8자 이상, 영문+숫자+특수문자를 포함해주세요.</div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label>비밀번호 확인 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('passwordConfirm')"></i>
                </div>
                <div class="error-message" id="passwordConfirmError">비밀번호가 일치하지 않습니다.</div>
                <div class="success-message" id="passwordConfirmSuccess">비밀번호가 일치합니다.</div>
            </div>

            <!-- 이름 -->
            <div class="form-group">
                <label>이름 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="실명을 입력해주세요" required>
                </div>
                <div class="error-message" id="nameError">이름을 입력해주세요.</div>
            </div>

            <!-- 생년월일 -->
            <div class="form-group">
                <label>생년월일 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="error-message" id="birthDateError">생년월일을 선택해주세요.</div>
            </div>

            <!-- 약관 동의 -->
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAll" onchange="toggleAllAgree()">
                    <label for="agreeAll"><strong>전체 동의</strong></label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeTerms" class="agree-item" required>
                    <label for="agreeTerms">[필수] 이용약관 동의</label>
                    <a href="terms.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreePrivacy" class="agree-item" required>
                    <label for="agreePrivacy">[필수] 개인정보처리방침 동의</label>
                    <a href="privacy.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAge" class="agree-item" required>
                    <label for="agreeAge">[필수] 만 14세 이상입니다</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeMarketing" class="agree-item">
                    <label for="agreeMarketing">[선택] 마케팅 정보 수신 동의</label>
                </div>
            </div>

            <!-- 가입 버튼 -->
            <button type="submit" class="btn-signup">
                <i class="fas fa-user-plus"></i> 회원가입
            </button>
        </form>

        <!-- 소셜 가입 -->
        <div class="social-signup">
            <div class="social-title">또는 소셜 계정으로 가입</div>
            <div class="social-buttons">
                <button class="social-btn kakao" onclick="socialSignup('kakao')">
                    <i class="fas fa-comment"></i> 카카오
                </button>
                <button class="social-btn naver" onclick="socialSignup('naver')">
                    <strong>N</strong> 네이버
                </button>
                <button class="social-btn google" onclick="socialSignup('google')">
                    <i class="fab fa-google"></i> 구글
                </button>
            </div>
        </div>

        <!-- 로그인 링크 -->
        <div class="login-link">
            이미 계정이 있으신가요? <a href="login.html">로그인</a>
        </div>
    </div>

    <script>
        // 이메일 중복 체크 (실제로는 API 호출)
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value;
            const emailError = document.getElementById('emailError');
            const emailSuccess = document.getElementById('emailSuccess');
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                this.classList.add('error');
                this.classList.remove('success');
                emailError.classList.add('show');
                emailSuccess.classList.remove('show');
            } else {
                // 실제로는 API로 중복 체크
                this.classList.remove('error');
                this.classList.add('success');
                emailError.classList.remove('show');
                emailSuccess.classList.add('show');
            }
        });

        // 비밀번호 강도 체크
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const passwordError = document.getElementById('passwordError');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 1) {
                strengthBar.classList.add('weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
            
            const isValid = password.length >= 8 && /[a-zA-Z]/.test(password) && /\d/.test(password);
            if (!isValid && password.length > 0) {
                this.classList.add('error');
                passwordError.classList.add('show');
            } else {
                this.classList.remove('error');
                passwordError.classList.remove('show');
            }
        });

        // 비밀번호 확인
        document.getElementById('passwordConfirm').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmError = document.getElementById('passwordConfirmError');
            const confirmSuccess = document.getElementById('passwordConfirmSuccess');
            
            if (this.value !== password) {
                this.classList.add('error');
                this.classList.remove('success');
                confirmError.classList.add('show');
                confirmSuccess.classList.remove('show');
            } else if (this.value.length > 0) {
                this.classList.remove('error');
                this.classList.add('success');
                confirmError.classList.remove('show');
                confirmSuccess.classList.add('show');
            }
        });

        // 비밀번호 보기/숨기기
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // 전체 동의
        function toggleAllAgree() {
            const agreeAll = document.getElementById('agreeAll');
            const agreeItems = document.querySelectorAll('.agree-item');
            
            agreeItems.forEach(item => {
                item.checked = agreeAll.checked;
            });
        }

        // 개별 체크박스 변경 시
        document.querySelectorAll('.agree-item').forEach(item => {
            item.addEventListener('change', function() {
                const agreeAll = document.getElementById('agreeAll');
                const agreeItems = document.querySelectorAll('.agree-item');
                const allChecked = Array.from(agreeItems).every(item => item.checked);
                agreeAll.checked = allChecked;
            });
        });

        // 폼 제출
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 필수 약관 체크
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const agreePrivacy = document.getElementById('agreePrivacy').checked;
            const agreeAge = document.getElementById('agreeAge').checked;
            
            if (!agreeTerms || !agreePrivacy || !agreeAge) {
                alert('필수 약관에 동의해주세요.');
                return;
            }
            
            // 비밀번호 확인
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            // 회원가입 데이터
            const signupData = {
                id: Date.now().toString(), // 고유 ID
                email: document.getElementById('email').value,
                password: password, // 실제로는 해시화 필요
                name: document.getElementById('name').value,
                birthDate: document.getElementById('birthDate').value,
                agreeMarketing: document.getElementById('agreeMarketing').checked,
                signupDate: new Date().toISOString(),
                remainingQuestions: 5 // 무료 질문 5개
            };
            
            console.log('✅ 회원가입 데이터:', signupData);
            
            // LocalStorage에 저장
            try {
                // 기존 사용자 목록 가져오기
                let users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // 이메일 중복 체크
                const existingUser = users.find(u => u.email === signupData.email);
                if (existingUser) {
                    alert('⚠️ 이미 가입된 이메일입니다.');
                    return;
                }
                
                // 새 사용자 추가
                users.push(signupData);
                localStorage.setItem('users', JSON.stringify(users));
                
                // 성공 메시지
                alert('🎉 회원가입이 완료되었습니다!\n로그인 페이지로 이동합니다.');
                
                // 로그인 페이지로 이동
                setTimeout(() => {
                    window.location.href = 'login.html?email=' + encodeURIComponent(signupData.email);
                }, 500);
            } catch (error) {
                console.error('❌ 회원가입 에러:', error);
                alert('회원가입 중 오류가 발생했습니다.');
            }
        });

        // 소셜 가입
        function socialSignup(provider) {
            alert(`${provider} 소셜 가입 기능입니다.\n(실제로는 OAuth 연동 필요)`);
            // 실제로는 OAuth 인증 처리
        }

        // ===== Global Error Handler =====
        window.addEventListener('error', function(e) {
            // aisaju1000.com 외의 스크립트 에러 무시
            if (e.filename && !e.filename.includes('aisaju1000.com')) {
                e.preventDefault();
                return false;
            }
        });

        console.log('✅ 회원가입 페이지 로드 완료');
    </script>
</body>
</html>
