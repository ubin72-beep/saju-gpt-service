<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 사주 천년지기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .required {
            color: #f5576c;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #f5576c;
        }

        .form-group input.success {
            border-color: #4CAF50;
        }

        .error-message {
            color: #f5576c;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #4CAF50;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-strength {
            height: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #f5576c;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #FFA500;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #4CAF50;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }

        .checkbox-group {
            margin-bottom: 25px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        .checkbox-item a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .checkbox-item a:hover {
            text-decoration: underline;
        }

        .btn-signup {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
        }

        .btn-signup:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .social-signup {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .social-title {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }

        .social-btn:hover {
            border-color: #667eea;
        }

        .social-btn.kakao {
            background: #FEE500;
            border-color: #FEE500;
        }

        .social-btn.kakao:hover {
            background: #FDD835;
        }

        .social-btn.naver {
            background: #03C75A;
            color: white;
            border-color: #03C75A;
        }

        .social-btn.naver:hover {
            background: #02B350;
        }

        .social-btn.google {
            border-color: #e0e0e0;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .signup-container {
                padding: 30px 20px;
            }

            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>🔮 AI 사주 천년지기</h1>
            <p>회원가입하고 무료 운세 보기</p>
        </div>

        <form id="signupForm">
            <!-- 이메일 -->
            <div class="form-group">
                <label>이메일 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="error-message" id="emailError">유효한 이메일을 입력해주세요.</div>
                <div class="success-message" id="emailSuccess">사용 가능한 이메일입니다.</div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label>비밀번호 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
                    <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError">8자 이상, 영문+숫자+특수문자를 포함해주세요.</div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label>비밀번호 확인 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                    <span class="password-toggle" onclick="togglePassword('passwordConfirm')">👁️</span>
                </div>
                <div class="error-message" id="passwordConfirmError">비밀번호가 일치하지 않습니다.</div>
                <div class="success-message" id="passwordConfirmSuccess">비밀번호가 일치합니다.</div>
            </div>

            <!-- 이름 -->
            <div class="form-group">
                <label>이름 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" placeholder="실명을 입력해주세요" required>
                </div>
                <div class="error-message" id="nameError">이름을 입력해주세요.</div>
            </div>

            <!-- 생년월일 -->
            <div class="form-group">
                <label>생년월일 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">📅</span>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="error-message" id="birthDateError">생년월일을 선택해주세요.</div>
            </div>

            <!-- 약관 동의 -->
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAll" onchange="toggleAllAgree()">
                    <label for="agreeAll"><strong>전체 동의</strong></label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeTerms" class="agree-item" required>
                    <label for="agreeTerms">[필수] 이용약관 동의</label>
                    <a href="terms.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreePrivacy" class="agree-item" required>
                    <label for="agreePrivacy">[필수] 개인정보처리방침 동의</label>
                    <a href="privacy.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAge" class="agree-item" required>
                    <label for="agreeAge">[필수] 만 14세 이상입니다</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeMarketing" class="agree-item">
                    <label for="agreeMarketing">[선택] 마케팅 정보 수신 동의</label>
                </div>
            </div>

            <!-- 가입 버튼 -->
            <button type="submit" class="btn-signup">
                ✨ 회원가입
            </button>
        </form>

        <!-- 소셜 가입 -->
        <div class="social-signup">
            <div class="social-title">또는 소셜 계정으로 가입</div>
            <div class="social-buttons">
                <button class="social-btn kakao" onclick="socialSignup('kakao')">
                    💬 카카오
                </button>
                <button class="social-btn naver" onclick="socialSignup('naver')">
                    <strong>N</strong> 네이버
                </button>
                <button class="social-btn google" onclick="socialSignup('google')">
                    🌐 구글
                </button>
            </div>
        </div>

        <!-- 로그인 링크 -->
        <div class="login-link">
            이미 계정이 있으신가요? <a href="login.html">로그인</a>
        </div>
    </div>

    <script>
        // 이메일 검증
        document.getElementById('email').addEventListener('blur', function() {
            var email = this.value;
            var emailError = document.getElementById('emailError');
            var emailSuccess = document.getElementById('emailSuccess');
            
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                this.classList.add('error');
                this.classList.remove('success');
                emailError.classList.add('show');
                emailSuccess.classList.remove('show');
            } else {
                this.classList.remove('error');
                this.classList.add('success');
                emailError.classList.remove('show');
                emailSuccess.classList.add('show');
            }
        });

        // 비밀번호 강도 체크
        document.getElementById('password').addEventListener('input', function() {
            var password = this.value;
            var strengthBar = document.getElementById('strengthBar');
            var passwordError = document.getElementById('passwordError');
            
            var strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 1) {
                strengthBar.classList.add('weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
            
            var isValid = password.length >= 8 && /[a-zA-Z]/.test(password) && /\d/.test(password);
            if (!isValid && password.length > 0) {
                this.classList.add('error');
                passwordError.classList.add('show');
            } else {
                this.classList.remove('error');
                passwordError.classList.remove('show');
            }
        });

        // 비밀번호 확인
        document.getElementById('passwordConfirm').addEventListener('input', function() {
            var password = document.getElementById('password').value;
            var confirmError = document.getElementById('passwordConfirmError');
            var confirmSuccess = document.getElementById('passwordConfirmSuccess');
            
            if (this.value !== password) {
                this.classList.add('error');
                this.classList.remove('success');
                confirmError.classList.add('show');
                confirmSuccess.classList.remove('show');
            } else if (this.value.length > 0) {
                this.classList.remove('error');
                this.classList.add('success');
                confirmError.classList.remove('show');
                confirmSuccess.classList.add('show');
            }
        });

        // 비밀번호 보기/숨기기
        function togglePassword(id) {
            var input = document.getElementById(id);
            var icon = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        // 전체 동의
        function toggleAllAgree() {
            var agreeAll = document.getElementById('agreeAll');
            var agreeItems = document.querySelectorAll('.agree-item');
            
            for (var i = 0; i < agreeItems.length; i++) {
                agreeItems[i].checked = agreeAll.checked;
            }
        }

        // 개별 체크박스 변경
        var agreeItems = document.querySelectorAll('.agree-item');
        for (var i = 0; i < agreeItems.length; i++) {
            agreeItems[i].addEventListener('change', function() {
                var agreeAll = document.getElementById('agreeAll');
                var items = document.querySelectorAll('.agree-item');
                var allChecked = true;
                
                for (var j = 0; j < items.length; j++) {
                    if (!items[j].checked) {
                        allChecked = false;
                        break;
                    }
                }
                
                agreeAll.checked = allChecked;
            });
        }

        // 폼 제출
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var agreeTerms = document.getElementById('agreeTerms').checked;
            var agreePrivacy = document.getElementById('agreePrivacy').checked;
            var agreeAge = document.getElementById('agreeAge').checked;
            
            if (!agreeTerms || !agreePrivacy || !agreeAge) {
                alert('필수 약관에 동의해주세요.');
                return;
            }
            
            var password = document.getElementById('password').value;
            var passwordConfirm = document.getElementById('passwordConfirm').value;
            
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            var signupData = {
                email: document.getElementById('email').value,
                password: password,
                name: document.getElementById('name').value,
                birthDate: document.getElementById('birthDate').value,
                agreeMarketing: document.getElementById('agreeMarketing').checked,
                signupDate: new Date().toISOString()
            };
            
            console.log('회원가입 데이터:', signupData);
            
            alert('회원가입이 완료되었습니다! 🎉\\n로그인 페이지로 이동합니다.');
            window.location.href = 'login.html';
        });

        // 소셜 가입
        function socialSignup(provider) {
            alert(provider + ' 소셜 가입 기능입니다.\\n(실제로는 OAuth 연동 필요)');
        }

        console.log('✅ 회원가입 페이지 로드 완료');
    </script>
</body>
</html>
