<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #c41e3a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .container { background: white; border-radius: 20px; padding: 3rem; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .success-icon { font-size: 4rem; color: #4CAF50; margin-bottom: 1.5rem; animation: bounce 1s ease; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } 60% { transform: translateY(-10px); } }
        h1 { font-family: 'Noto Serif KR', serif; font-size: 2rem; color: #1a1a1a; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 2rem; }
        .order-info { background: #f9f9f9; border-radius: 15px; padding: 2rem; margin-bottom: 2rem; text-align: left; }
        .info-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid #eee; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; font-weight: 500; }
        .info-value { color: #1a1a1a; font-weight: 600; }
        .amount { font-size: 1.8rem; color: #c41e3a; font-weight: bold; }
        .button-group { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn { flex: 1; padding: 1rem; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
        .btn-primary { background: #c41e3a; color: white; }
        .btn-primary:hover { background: #a01830; transform: scale(1.05); }
        .btn-secondary { background: #f0f0f0; color: #666; }
        .btn-secondary:hover { background: #e0e0e0; }
        .notice { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 1rem; margin-top: 1.5rem; font-size: 0.9rem; color: #856404; }
        #loading { display: block; }
        #content { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #c41e3a;"></i>
            <p style="margin-top: 1rem; color: #666;">결제 확인 중...</p>
        </div>
        
        <div id="content">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1>결제가 완료되었습니다!</h1>
            <p class="subtitle">주문이 정상적으로 처리되었습니다.</p>
            
            <div class="order-info">
                <div class="info-row">
                    <span class="info-label">주문번호</span>
                    <span class="info-value" id="orderId">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">상품명</span>
                    <span class="info-value" id="orderName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제수단</span>
                    <span class="info-value" id="paymentMethod">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제금액</span>
                    <span class="info-value amount" id="amount">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제일시</span>
                    <span class="info-value" id="approvedAt">-</span>
                </div>
            </div>
            
            <div class="notice">
                <i class="fas fa-info-circle"></i>
                <strong>안내사항</strong><br>
                • 구매하신 서비스는 <a href="mypage.html" style="color: #c41e3a; text-decoration: underline;">마이페이지</a>에서 확인 가능합니다.<br>
                • 영수증은 이메일로 발송됩니다.<br>
                • 환불 문의: <a href="mailto:aisaju1000@gmail.com" style="color: #c41e3a;">aisaju1000@gmail.com</a>
            </div>
            
            <div class="button-group">
                <a href="mypage.html" class="btn btn-primary">
                    <i class="fas fa-user"></i> 마이페이지
                </a>
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> 홈으로
                </a>
            </div>
        </div>
    </div>

    <!-- 토스페이먼츠 SDK -->
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
    
    <script>
        // URL에서 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');
        
        console.log('✅ 결제 성공 페이지 로드');
        console.log('paymentKey:', paymentKey);
        console.log('orderId:', orderId);
        console.log('amount:', amount);
        
        // Google Sheets 배포 URL (결제 내역 저장용)
        const PAYMENT_SHEETS_URL = 'YOUR_PAYMENT_SHEETS_URL_HERE';
        
        // 결제 확인 및 승인
        async function confirmPayment() {
            try {
                // 토스페이먼츠에 결제 승인 요청
                // 실제로는 서버에서 처리해야 하지만, 정적 웹사이트이므로 클라이언트에서 처리
                const clientKey = 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq';
                const secretKey = 'test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R';
                
                const response = await fetch('https://api.tosspayments.com/v1/payments/confirm', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Basic ' + btoa(secretKey + ':'),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        paymentKey: paymentKey,
                        orderId: orderId,
                        amount: amount
                    })
                });
                
                if (!response.ok) {
                    throw new Error('결제 승인 실패');
                }
                
                const data = await response.json();
                console.log('✅ 결제 승인 완료:', data);
                
                // 화면에 결제 정보 표시
                displayPaymentInfo(data);
                
                // Google Sheets에 저장
                await saveToGoogleSheets(data);
                
                // localStorage에 저장
                saveToLocalStorage(data);
                
            } catch (error) {
                console.error('❌ 결제 확인 실패:', error);
                
                // 오류 발생 시에도 기본 정보 표시
                document.getElementById('orderId').textContent = orderId || '-';
                document.getElementById('amount').textContent = amount ? '₩' + parseInt(amount).toLocaleString() : '-';
                
                // 로딩 숨기고 컨텐츠 표시
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                alert('결제는 완료되었으나 정보 조회 중 오류가 발생했습니다.\n마이페이지에서 확인해주세요.');
            }
        }
        
        // 결제 정보 화면 표시
        function displayPaymentInfo(data) {
            document.getElementById('orderId').textContent = data.orderId || '-';
            document.getElementById('orderName').textContent = data.orderName || '-';
            document.getElementById('paymentMethod').textContent = getPaymentMethodName(data.method) || '-';
            document.getElementById('amount').textContent = '₩' + (data.totalAmount || 0).toLocaleString();
            document.getElementById('approvedAt').textContent = formatDate(data.approvedAt) || '-';
            
            // 로딩 숨기고 컨텐츠 표시
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
        
        // 결제 수단 이름 변환
        function getPaymentMethodName(method) {
            const names = {
                '카드': '신용/체크카드',
                '가상계좌': '가상계좌',
                '계좌이체': '계좌이체',
                '휴대폰': '휴대폰 소액결제',
                '상품권': '상품권',
                '간편결제': '간편결제'
            };
            return names[method] || method;
        }
        
        // 날짜 포맷
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Google Sheets에 저장
        async function saveToGoogleSheets(data) {
            if (PAYMENT_SHEETS_URL === 'YOUR_PAYMENT_SHEETS_URL_HERE') {
                console.log('⚠️ Google Sheets URL이 설정되지 않음');
                return;
            }
            
            try {
                const paymentData = {
                    orderId: data.orderId,
                    orderName: data.orderName,
                    amount: data.totalAmount,
                    method: data.method,
                    approvedAt: data.approvedAt,
                    paymentKey: data.paymentKey
                };
                
                await fetch(PAYMENT_SHEETS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(paymentData)
                });
                
                console.log('✅ Google Sheets 저장 완료');
            } catch (error) {
                console.error('⚠️ Google Sheets 저장 실패:', error);
            }
        }
        
        // localStorage에 저장
        function saveToLocalStorage(data) {
            try {
                const purchases = JSON.parse(localStorage.getItem('purchaseHistory') || '[]');
                purchases.unshift({
                    orderId: data.orderId,
                    orderName: data.orderName,
                    amount: data.totalAmount,
                    method: data.method,
                    approvedAt: data.approvedAt,
                    paymentKey: data.paymentKey,
                    status: 'completed'
                });
                localStorage.setItem('purchaseHistory', JSON.stringify(purchases));
                console.log('✅ localStorage 저장 완료');
            } catch (error) {
                console.error('⚠️ localStorage 저장 실패:', error);
            }
        }
        
        // 페이지 로드 시 결제 확인
        if (paymentKey && orderId && amount) {
            confirmPayment();
        } else {
            // 파라미터가 없으면 에러 페이지로 이동
            alert('잘못된 접근입니다.');
            window.location.href = 'pricing.html';
        }
    </script>
</body>
</html>
