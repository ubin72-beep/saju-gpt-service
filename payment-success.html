<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - AI사주천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            max-width: 600px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .success-icon {
            font-size: 5em;
            color: #4caf50;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .message {
            color: rgba(255,255,255,0.8);
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .payment-details {
            background: rgba(212, 175, 55, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #f4e5b5;
            font-weight: 600;
        }

        .detail-value {
            color: white;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #f4e5b5 100%);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .buttons {
                flex-direction: column;
            }

            .success-card {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div id="loadingSection" class="loading">
            <div class="spinner"></div>
            <p style="color: rgba(255,255,255,0.7);">결제 정보를 확인하는 중입니다...</p>
        </div>

        <div id="successSection" style="display: none;">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>결제가 완료되었습니다</h1>
            <p class="message">
                결제가 성공적으로 처리되었습니다.<br>
                영수증은 등록하신 이메일로 발송됩니다.
            </p>

            <div class="payment-details">
                <div class="detail-row">
                    <span class="detail-label">주문번호</span>
                    <span class="detail-value" id="orderId">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">상품명</span>
                    <span class="detail-value" id="orderName">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 금액</span>
                    <span class="detail-value" id="amount">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 수단</span>
                    <span class="detail-value" id="paymentMethod">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 일시</span>
                    <span class="detail-value" id="approvedAt">-</span>
                </div>
            </div>

            <div class="buttons">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> 홈으로
                </a>
                <a href="admin-login.html" class="btn btn-secondary">
                    <i class="fas fa-receipt"></i> 영수증 보기
                </a>
            </div>
        </div>
    </div>

    <script>
        // URL 파라미터에서 결제 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        console.log('결제 승인 시작:', { paymentKey, orderId, amount });

        // 결제 승인 처리
        async function approvePayment() {
            try {
                console.log('🔍 결제 승인 시작:', { paymentKey, orderId, amount });
                
                // localStorage에서 결제 정보 가져오기
                const storedPaymentData = localStorage.getItem('current_payment_' + orderId) || localStorage.getItem('pending_payment_' + orderId);
                let paymentInfo = null;
                
                if (storedPaymentData) {
                    paymentInfo = JSON.parse(storedPaymentData);
                    console.log('✅ localStorage에서 결제 정보 복원:', paymentInfo);
                }
                
                // 1. DB에서 결제 정보 검색 시도
                let payment = null;
                try {
                    console.log('결제 정보 검색 중...');
                    const searchResponse = await fetch(`tables/payments?limit=100&sort=-created_at`);
                    
                    if (searchResponse.ok) {
                        const searchResult = await searchResponse.json();
                        console.log('검색 결과:', searchResult);
                        payment = searchResult.data.find(p => p.order_id === orderId);
                        
                        if (payment) {
                            console.log('✅ DB에서 결제 정보 발견:', payment);
                        } else {
                            console.warn('⚠️ DB에 결제 정보 없음, localStorage 데이터 사용');
                        }
                    } else {
                        console.warn('⚠️ DB 검색 실패, localStorage 데이터 사용');
                    }
                } catch (searchError) {
                    console.warn('⚠️ DB 연결 실패, localStorage 데이터 사용:', searchError);
                }

                // 2. 결제 금액 검증
                const receivedAmount = parseInt(amount);
                const expectedAmount = payment ? payment.amount : (paymentInfo ? paymentInfo.amount : receivedAmount);
                
                if (receivedAmount !== expectedAmount) {
                    console.error('❌ 금액 불일치:', { receivedAmount, expectedAmount });
                    throw new Error(`결제 금액이 일치하지 않습니다. (요청: ${expectedAmount}원, 승인: ${receivedAmount}원)`);
                }
                
                console.log('✅ 금액 검증 완료');

                // 3. DB 업데이트 시도 (실패해도 화면은 표시)
                let updateSuccess = false;
                if (payment && payment.id) {
                    try {
                        console.log('결제 상태 업데이트 중...');
                        const updateResponse = await fetch(`tables/payments/${payment.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                payment_key: paymentKey,
                                status: '완료',
                                approved_at: new Date().toISOString(),
                                updated_at: new Date().toISOString()
                            })
                        });

                        if (updateResponse.ok) {
                            const updatedPayment = await updateResponse.json();
                            console.log('✅ 결제 상태 업데이트 완료:', updatedPayment);
                            updateSuccess = true;
                        } else {
                            console.warn('⚠️ DB 업데이트 실패');
                        }
                    } catch (updateError) {
                        console.warn('⚠️ DB 업데이트 오류:', updateError);
                    }
                }
                
                // DB 업데이트 실패 시 localStorage에 완료 정보 저장
                if (!updateSuccess && paymentInfo) {
                    paymentInfo.payment_key = paymentKey;
                    paymentInfo.status = '완료';
                    paymentInfo.approved_at = new Date().toISOString();
                    localStorage.setItem('completed_payment_' + orderId, JSON.stringify(paymentInfo));
                    console.log('💾 localStorage에 완료 정보 저장');
                }

                // 4. 화면에 표시
                const displayInfo = payment || paymentInfo || {
                    product_name: '상품',
                    amount: receivedAmount,
                    payment_method: '카드'
                };
                
                document.getElementById('orderId').textContent = orderId;
                document.getElementById('orderName').textContent = displayInfo.product_name || '-';
                document.getElementById('amount').textContent = (displayInfo.amount || 0).toLocaleString() + '원';
                document.getElementById('paymentMethod').textContent = displayInfo.payment_method || '-';
                document.getElementById('approvedAt').textContent = new Date().toLocaleString('ko-KR');

                // 5. 로딩 숨기고 성공 화면 표시
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';

                console.log('🎉 결제 승인 완료!');
                
                // localStorage 정리
                localStorage.removeItem('current_payment_' + orderId);
                localStorage.removeItem('pending_payment_' + orderId);
                
                // 6. 비회원 결제 시 회원가입 유도
                showSignupPromotion(displayInfo);

            } catch (error) {
                console.error('❌ 결제 승인 오류:', error);
                
                // 오류 발생해도 결제는 성공했으므로 화면 표시
                console.log('⚠️ 오류 발생했지만 결제는 완료됨, 기본 정보로 표시');
                
                document.getElementById('orderId').textContent = orderId;
                document.getElementById('orderName').textContent = '결제 완료';
                document.getElementById('amount').textContent = parseInt(amount).toLocaleString() + '원';
                document.getElementById('paymentMethod').textContent = '카드';
                document.getElementById('approvedAt').textContent = new Date().toLocaleString('ko-KR');
                
                // 성공 화면 표시
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
                
                // 완료된 결제 정보 localStorage에 보관
                const completedPayment = {
                    order_id: orderId,
                    payment_key: paymentKey,
                    amount: parseInt(amount),
                    status: '완료',
                    approved_at: new Date().toISOString(),
                    note: 'DB 저장 실패, 수동 처리 필요'
                };
                localStorage.setItem('completed_payment_' + orderId, JSON.stringify(completedPayment));
                console.log('💾 완료 정보 localStorage 저장:', completedPayment);
            }
        }

        // 비회원 결제 완료 시 회원가입 유도
        function showSignupPromotion(paymentInfo) {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            
            if (!isLoggedIn) {
                // 비회원 결제 완료 - 회원가입 유도 배너 표시
                const signupPromo = document.createElement('div');
                signupPromo.style.cssText = `
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    border-radius: 20px;
                    padding: 35px;
                    margin-top: 30px;
                    text-align: center;
                    color: white;
                    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
                    animation: slideUp 0.5s ease;
                `;
                
                const customerEmail = paymentInfo.customer_email || paymentInfo.email || '';
                
                signupPromo.innerHTML = `
                    <div style="font-size: 3em; margin-bottom: 15px;">🎁</div>
                    <h3 style="margin-bottom: 20px; font-size: 1.5em; font-weight: 700;">
                        지금 회원가입하면
                    </h3>
                    <div style="background: rgba(255,255,255,0.2); border-radius: 15px; padding: 20px; margin-bottom: 25px;">
                        <ul style="list-style: none; padding: 0; margin: 0; line-height: 2.2; font-size: 1.05em;">
                            <li>✅ <strong>다음 결제 시 정보 자동 입력</strong></li>
                            <li>✅ <strong>구매 내역 자동 저장 및 조회</strong></li>
                            <li>✅ <strong>첫 결제 10% 할인 쿠폰 제공</strong></li>
                            <li>✅ <strong>AI 사주 상담 무료 1회 제공</strong></li>
                        </ul>
                    </div>
                    <a href="login.html?tab=signup&email=${encodeURIComponent(customerEmail)}" 
                       style="display: inline-block; background: white; color: #667eea; padding: 15px 40px; 
                              border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 1.1em;
                              box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: all 0.3s;"
                       onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.3)';" 
                       onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px 15px rgba(0,0,0,0.2)';">
                        <i class="fas fa-user-plus"></i> 무료 회원가입하고 혜택 받기
                    </a>
                    <p style="margin-top: 15px; font-size: 0.9em; opacity: 0.9;">
                        이미 계정이 있으신가요? 
                        <a href="login.html?email=${encodeURIComponent(customerEmail)}" 
                           style="color: white; text-decoration: underline; font-weight: 600;">
                            로그인하기
                        </a>
                    </p>
                `;
                
                document.querySelector('.success-card').appendChild(signupPromo);
                
                console.log('📢 회원가입 유도 배너 표시');
            } else {
                // 회원 결제 완료 - 감사 메시지
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                const thankYouMessage = document.createElement('div');
                thankYouMessage.style.cssText = `
                    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
                    border: 2px solid #4caf50;
                    border-radius: 20px;
                    padding: 25px;
                    margin-top: 30px;
                    text-align: center;
                    color: #2e7d32;
                    animation: slideUp 0.5s ease;
                `;
                
                thankYouMessage.innerHTML = `
                    <div style="font-size: 2.5em; margin-bottom: 10px;">💚</div>
                    <h3 style="margin-bottom: 10px; font-size: 1.3em; font-weight: 700; color: #2e7d32;">
                        ${currentUser.name}님, 이용해 주셔서 감사합니다!
                    </h3>
                    <p style="font-size: 1em; margin-bottom: 15px; color: #388e3c;">
                        결제 내역은 <strong>마이페이지</strong>에서 확인하실 수 있습니다.
                    </p>
                    <a href="mypage.html" 
                       style="display: inline-block; background: #4caf50; color: white; padding: 12px 30px; 
                              border-radius: 25px; text-decoration: none; font-weight: 600;
                              transition: all 0.3s;"
                       onmouseover="this.style.background='#388e3c';" 
                       onmouseout="this.style.background='#4caf50';">
                        <i class="fas fa-user"></i> 마이페이지 바로가기
                    </a>
                `;
                
                document.querySelector('.success-card').appendChild(thankYouMessage);
                
                console.log('✅ 회원 감사 메시지 표시');
            }
        }
        
        // 페이지 로드 시 실행
        if (paymentKey && orderId && amount) {
            approvePayment();
        } else {
            console.error('필수 파라미터 누락:', { paymentKey, orderId, amount });
            alert('잘못된 접근입니다.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
