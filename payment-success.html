<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - AI 사주 천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            text-align: center;
        }
        
        .success-icon {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            padding: 40px;
            color: white;
        }
        
        .success-icon i {
            font-size: 5rem;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .content h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        
        .content p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .order-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-weight: 500;
        }
        
        .info-value {
            color: #1a1a1a;
            font-weight: 700;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
        }
        
        .notice {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #856404;
            text-align: left;
        }
        
        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <div class="content">
            <h1>🎉 결제가 완료되었습니다!</h1>
            <p>구매해주셔서 감사합니다. 이메일로 영수증이 발송되었습니다.</p>
            
            <div class="order-info">
                <div class="info-row">
                    <span class="info-label">주문번호</span>
                    <span class="info-value" id="orderId">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">상품명</span>
                    <span class="info-value" id="orderName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제금액</span>
                    <span class="info-value" id="amount">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제수단</span>
                    <span class="info-value" id="method">-</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <a href="mypage.html" class="btn btn-primary">
                    <i class="fas fa-user"></i> 내 서비스 보기
                </a>
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> 홈으로
                </a>
            </div>
            
            <div class="notice">
                <i class="fas fa-info-circle"></i>
                <strong>안내사항</strong><br>
                • 구매하신 서비스는 마이페이지에서 확인하실 수 있습니다.<br>
                • 영수증은 이메일로 발송되었습니다.<br>
                • 문의사항은 고객센터(0502-1909-7788)로 연락주세요.
            </div>
        </div>
    </div>
    
    <script src="https://js.tosspayments.com/v1/payment"></script>
    
    <script>
        // URL 파라미터에서 결제 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');
        
        // 결제 정보 표시
        if (orderId) {
            document.getElementById('orderId').textContent = orderId;
        }
        
        if (amount) {
            document.getElementById('amount').textContent = `₩${parseInt(amount).toLocaleString()}`;
        }
        
        // 토스페이먼츠 승인 처리
        const clientKey = 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq';
        
        async function confirmPayment() {
            try {
                // 실제 서버에서는 여기서 백엔드 API를 호출하여 결제 승인
                // 현재는 정적 페이지이므로 클라이언트에서 처리
                
                const response = await fetch('https://api.tosspayments.com/v1/payments/confirm', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${btoa(clientKey + ':')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        paymentKey: paymentKey,
                        orderId: orderId,
                        amount: amount
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // 결제 승인 성공
                    document.getElementById('orderName').textContent = data.orderName || '-';
                    document.getElementById('method').textContent = getMethodName(data.method) || '-';
                    
                    console.log('✅ 결제 승인 완료:', data);
                } else {
                    console.error('❌ 결제 승인 실패:', data);
                }
            } catch (error) {
                console.error('❌ 결제 확인 오류:', error);
            }
        }
        
        function getMethodName(method) {
            const methods = {
                'CARD': '신용/체크카드',
                'TRANSFER': '계좌이체',
                'VIRTUAL_ACCOUNT': '가상계좌',
                'EASY_PAY': '간편결제'
            };
            return methods[method] || method;
        }
        
        // 페이지 로드 시 결제 확인
        if (paymentKey && orderId && amount) {
            confirmPayment();
        } else {
            // 파라미터가 없으면 기본값 표시
            document.getElementById('orderName').textContent = '프리미엄 분석';
            document.getElementById('method').textContent = '신용/체크카드';
        }
        
        console.log('✅ 결제 완료 페이지 로드');
    </script>
</body>
</html>
