<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - AI사주천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            max-width: 600px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .success-icon {
            font-size: 5em;
            color: #4caf50;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .message {
            color: rgba(255,255,255,0.8);
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .payment-details {
            background: rgba(212, 175, 55, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #f4e5b5;
            font-weight: 600;
        }

        .detail-value {
            color: white;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #f4e5b5 100%);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .buttons {
                flex-direction: column;
            }

            .success-card {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div id="loadingSection" class="loading">
            <div class="spinner"></div>
            <p style="color: rgba(255,255,255,0.7);">결제 정보를 확인하는 중입니다...</p>
        </div>

        <div id="successSection" style="display: none;">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>결제가 완료되었습니다</h1>
            <p class="message">
                결제가 성공적으로 처리되었습니다.<br>
                영수증은 등록하신 이메일로 발송됩니다.
            </p>

            <div class="payment-details">
                <div class="detail-row">
                    <span class="detail-label">주문번호</span>
                    <span class="detail-value" id="orderId">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">상품명</span>
                    <span class="detail-value" id="orderName">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 금액</span>
                    <span class="detail-value" id="amount">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 수단</span>
                    <span class="detail-value" id="paymentMethod">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">결제 일시</span>
                    <span class="detail-value" id="approvedAt">-</span>
                </div>
            </div>

            <div class="buttons">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> 홈으로
                </a>
                <a href="admin-login.html" class="btn btn-secondary">
                    <i class="fas fa-receipt"></i> 영수증 보기
                </a>
            </div>
        </div>
    </div>

    <script>
        // URL 파라미터에서 결제 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        console.log('결제 승인 시작:', { paymentKey, orderId, amount });

        // 결제 승인 처리
        async function approvePayment() {
            try {
                console.log('🔍 결제 승인 시작:', { paymentKey, orderId, amount });
                
                // 1. orderId로 결제 정보 검색
                console.log('결제 정보 검색 중...');
                const searchResponse = await fetch(`tables/payments?limit=100&sort=-created_at`);
                const searchResult = await searchResponse.json();
                
                console.log('검색 결과:', searchResult);

                // orderId로 필터링
                const payment = searchResult.data.find(p => p.order_id === orderId);
                
                if (!payment) {
                    console.error('❌ 결제 정보를 찾을 수 없습니다:', orderId);
                    throw new Error('결제 정보를 찾을 수 없습니다.');
                }

                console.log('✅ 결제 정보 발견:', payment);

                // 2. 결제 금액 검증
                const receivedAmount = parseInt(amount);
                const expectedAmount = payment.amount;
                
                if (receivedAmount !== expectedAmount) {
                    console.error('❌ 금액 불일치:', { receivedAmount, expectedAmount });
                    throw new Error(`결제 금액이 일치하지 않습니다. (요청: ${expectedAmount}원, 승인: ${receivedAmount}원)`);
                }
                
                console.log('✅ 금액 검증 완료');

                // 3. 결제 완료 상태로 업데이트
                console.log('결제 상태 업데이트 중...');
                const updateResponse = await fetch(`tables/payments/${payment.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        payment_key: paymentKey,
                        status: '완료',
                        approved_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });

                if (!updateResponse.ok) {
                    const errorText = await updateResponse.text();
                    console.error('❌ 업데이트 실패:', errorText);
                    throw new Error('결제 상태 업데이트 실패');
                }
                
                const updatedPayment = await updateResponse.json();
                console.log('✅ 결제 상태 업데이트 완료:', updatedPayment);

                // 4. 화면에 표시
                document.getElementById('orderId').textContent = orderId;
                document.getElementById('orderName').textContent = payment.product_name || '-';
                document.getElementById('amount').textContent = (payment.amount || 0).toLocaleString() + '원';
                document.getElementById('paymentMethod').textContent = payment.payment_method || '-';
                document.getElementById('approvedAt').textContent = new Date().toLocaleString('ko-KR');

                // 5. 로딩 숨기고 성공 화면 표시
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';

                console.log('🎉 결제 승인 완료!');

            } catch (error) {
                console.error('❌ 결제 승인 오류:', error);
                
                // 실패 상태로 업데이트 시도
                try {
                    const searchResponse = await fetch(`tables/payments?limit=100&sort=-created_at`);
                    const searchResult = await searchResponse.json();
                    const payment = searchResult.data.find(p => p.order_id === orderId);
                    
                    if (payment) {
                        await fetch(`tables/payments/${payment.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                status: '실패',
                                error_message: error.message || '승인 처리 실패',
                                updated_at: new Date().toISOString()
                            })
                        });
                        console.log('실패 상태 업데이트 완료');
                    }
                } catch (updateError) {
                    console.error('실패 상태 업데이트 오류:', updateError);
                }
                
                // 고객센터 정보 표시
                document.getElementById('loadingSection').innerHTML = `
                    <div style="color: #ff4444; text-align: center;">
                        <i class="fas fa-exclamation-circle" style="font-size: 3em; margin-bottom: 20px;"></i>
                        <h2 style="color: #ff4444; margin-bottom: 15px;">결제 처리 중 오류가 발생했습니다</h2>
                        <p style="margin: 20px 0; color: rgba(255,255,255,0.8);">고객센터로 문의해주세요.</p>
                        <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px 0;">
                            <p style="color: white; margin: 10px 0;"><strong>주문번호:</strong> ${orderId}</p>
                            <p style="color: white; margin: 10px 0;"><strong>오류 내용:</strong> ${error.message}</p>
                            <p style="color: white; margin: 10px 0;"><strong>전화:</strong> 0502-1909-7788</p>
                            <p style="color: white; margin: 10px 0;"><strong>이메일:</strong> aisaju1000@gmail.com</p>
                        </div>
                        <button onclick="window.location.href='index.html'" style="margin-top: 20px; padding: 15px 30px; background: #d4af37; border: none; border-radius: 10px; color: #1a1a1a; font-weight: bold; cursor: pointer; font-size: 1em;">
                            <i class="fas fa-home"></i> 홈으로 돌아가기
                        </button>
                    </div>
                `;
            }
        }

        // 페이지 로드 시 실행
        if (paymentKey && orderId && amount) {
            approvePayment();
        } else {
            console.error('필수 파라미터 누락:', { paymentKey, orderId, amount });
            alert('잘못된 접근입니다.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
