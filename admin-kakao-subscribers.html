<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 구독자 관리 - AI 사주 천년지기</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #8b5cf6;
        }
        
        .stat-card.green { border-left-color: #10b981; }
        .stat-card.blue { border-left-color: #3b82f6; }
        .stat-card.orange { border-left-color: #f59e0b; }
        .stat-card.purple { border-left-color: #8b5cf6; }
        
        .stat-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
        }
        
        .stat-change {
            font-size: 14px;
            margin-top: 8px;
        }
        
        .stat-change.positive {
            color: #10b981;
        }
        
        .chart-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            height: 400px;
        }
        
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
        }
        
        .filter-group select {
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn-export {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-export:hover {
            background: #059669;
        }
        
        .subscribers-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f9fafb;
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        
        td {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status-paused {
            background: #fef3c7;
            color: #92400e;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-edit {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }
        
        .pagination button {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .pagination button.active {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body class="admin-body">
    <!-- 사이드바 -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-yin-yang"></i>
            </div>
            <h2>관리자</h2>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-title">메뉴</div>
            <div class="nav-item">
                <a href="admin.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>대시보드</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-users.html" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>회원 관리</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-orders.html" class="nav-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span>주문/결제</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-chat.html" class="nav-link">
                    <i class="fas fa-comments"></i>
                    <span>AI 상담</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-notifications.html" class="nav-link">
                    <i class="fas fa-bell"></i>
                    <span>알람</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-content.html" class="nav-link">
                    <i class="fas fa-file-alt"></i>
                    <span>콘텐츠</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-blog.html" class="nav-link">
                    <i class="fas fa-blog"></i>
                    <span>블로그</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-kakao-subscribers.html" class="nav-link active">
                    <i class="fas fa-comment-dots"></i>
                    <span>카카오 구독자</span>
                    <span class="badge badge-new">NEW</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-analytics.html" class="nav-link">
                    <i class="fas fa-chart-pie"></i>
                    <span>통계</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="admin-settings.html" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>설정</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-main">
        <!-- 헤더 -->
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-title">
                    <h1>📱 카카오 매일 운세 구독자 관리</h1>
                    <p>메인 페이지에서 신청한 구독자를 관리하세요</p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-header" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                </button>
            </div>
        </header>

        <!-- 콘텐츠 -->
        <div class="admin-content">
            <!-- 통계 카드 -->
            <div class="stats-grid">
                <div class="stat-card purple">
                    <div class="stat-title">📊 총 구독자</div>
                    <div class="stat-value" id="totalSubscribers">0</div>
                    <div class="stat-change positive">
                        <i class="fas fa-arrow-up"></i> 누적 데이터
                    </div>
                </div>
                
                <div class="stat-card green">
                    <div class="stat-title">✅ 활성 구독자</div>
                    <div class="stat-value" id="activeSubscribers">0</div>
                    <div class="stat-change positive">
                        <i class="fas fa-check-circle"></i> 정상 발송중
                    </div>
                </div>
                
                <div class="stat-card orange">
                    <div class="stat-title">🔔 오늘 신규</div>
                    <div class="stat-value" id="todaySubscribers">0</div>
                    <div class="stat-change positive">
                        <i class="fas fa-plus-circle"></i> 금일 신청
                    </div>
                </div>
                
                <div class="stat-card blue">
                    <div class="stat-title">🎁 무료 기간</div>
                    <div class="stat-value" id="freeSubscribers">0</div>
                    <div class="stat-change positive">
                        <i class="fas fa-gift"></i> 무료 이용중
                    </div>
                </div>
            </div>

            <!-- 차트 -->
            <div class="chart-container">
                <canvas id="subscribersChart"></canvas>
            </div>

            <!-- 검색 및 필터 -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 이름, 전화번호 검색..." onkeyup="filterSubscribers()">
                </div>
                
                <div class="filter-group">
                    <select id="statusFilter" onchange="filterSubscribers()">
                        <option value="all">전체 상태</option>
                        <option value="active">활성</option>
                        <option value="inactive">비활성</option>
                        <option value="paused">일시중지</option>
                    </select>
                    
                    <select id="zodiacFilter" onchange="filterSubscribers()">
                        <option value="all">전체 띠</option>
                        <option value="쥐띠">쥐띠</option>
                        <option value="소띠">소띠</option>
                        <option value="호랑이띠">호랑이띠</option>
                        <option value="토끼띠">토끼띠</option>
                        <option value="용띠">용띠</option>
                        <option value="뱀띠">뱀띠</option>
                        <option value="말띠">말띠</option>
                        <option value="양띠">양띠</option>
                        <option value="원숭이띠">원숭이띠</option>
                        <option value="닭띠">닭띠</option>
                        <option value="개띠">개띠</option>
                        <option value="돼지띠">돼지띠</option>
                    </select>
                </div>
                
                <button class="btn-export" onclick="exportToCSV()">
                    <i class="fas fa-download"></i>
                    CSV 내보내기
                </button>
            </div>

            <!-- 구독자 테이블 -->
            <div class="subscribers-table">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>이름</th>
                                <th>전화번호</th>
                                <th>생년</th>
                                <th>띠</th>
                                <th>상태</th>
                                <th>구독일</th>
                                <th>무료기간</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="subscribersTableBody">
                            <!-- 동적으로 채워짐 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 빈 상태 -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <h3>구독자가 없습니다</h3>
                    <p>메인 페이지에서 첫 구독자를 받아보세요!</p>
                </div>
                
                <!-- 페이지네이션 -->
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/admin-kakao-subscribers.js"></script>
</body>
</html>
