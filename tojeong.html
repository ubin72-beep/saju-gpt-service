                birthYear: birthYear
            });

            monthGrid.innerHTML = '';

                const data = TOJEONG_DATA[month];
                const card = createMonthCard(data);
                monthGrid.appendChild(card);
            }

            document.getElementById('fortuneResult').style.display = 'block';
            document.getElementById('fortuneResult').scrollIntoView({ behavior: 'smooth' });
        }

            card.className = 'month-card';
            
            card.innerHTML = `
                <div class="month-header">
                    <div class="month-title">${data.title}</div>
                    <div class="fortune-badge fortune-${data.fortune}">
                        ${getFortuneLabelKorean(data.fortune)}
                    </div>
                </div>
                <div class="fortune-stars">${data.stars}</div>
                <div class="fortune-content">
                    <h4>${data.summary}</h4>
                    <p>${data.detail}</p>
                    <div class="lucky-items">
                        <h5>🍀 이달의 행운</h5>
                        <p><strong>색상:</strong> ${data.luckyColor}</p>
                        <p><strong>방향:</strong> ${data.luckyDirection}</p>
                        <p><strong>숫자:</strong> ${data.luckyNumber}</p>
                    </div>
                    <div class="advice-box">
                        <strong>💡 조언:</strong> ${data.advice}
                    </div>
                </div>
            `;
            
            return card;
        }

        function getFortuneLabelKorean(fortune) {
            const labels = {
                'excellent': '대길',
                'good': '길',
                'normal': '평',
                'caution': '주의'
            };
            return labels[fortune] || '평';
        }

        // 전역 에러 핸들러
        window.addEventListener('error', function(e) {
            if (e.filename && !e.filename.includes('aisaju1000.com')) {
                e.preventDefault();
                return true;
            }
        }, true);

        // DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ 토정비결 2026 페이지 로드 완료');
        });
    </script>
</body>
</html>
