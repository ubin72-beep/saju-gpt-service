<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 - AI사주천년지기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 토스페이먼츠 SDK v1 -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .payment-card {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255,255,255,0.7);
            font-size: 1em;
        }

        .product-info {
            background: rgba(212, 175, 55, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .product-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .product-label {
            color: #f4e5b5;
            font-weight: 600;
        }

        .product-value {
            color: white;
            font-weight: 700;
        }

        .total-amount {
            font-size: 1.5em;
            color: #d4af37;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #f4e5b5;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }

        .payment-methods {
            margin: 30px 0;
        }

        .payment-methods h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .method-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .method-card {
            background: rgba(212, 175, 55, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .method-card:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        .method-card.selected {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .method-icon {
            font-size: 2em;
            margin-bottom: 10px;
            color: #d4af37;
        }

        .method-name {
            color: white;
            font-weight: 600;
        }

        .pay-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5b5 100%);
            border: none;
            color: #1a1a1a;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        .pay-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notice {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
        }

        .notice i {
            color: #ffc107;
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .method-grid {
                grid-template-columns: 1fr;
            }

            .payment-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-card">
            <div class="header">
                <h1><i class="fas fa-credit-card"></i> 결제하기</h1>
                <p>안전한 토스페이먼츠로 결제합니다</p>
            </div>

            <!-- 상품 정보 -->
            <div class="product-info">
                <div class="product-row">
                    <span class="product-label">상품명</span>
                    <span class="product-value" id="productName">프리미엄 사주 분석</span>
                </div>
                <div class="product-row">
                    <span class="product-label">수량</span>
                    <span class="product-value">1개</span>
                </div>
                <div class="product-row">
                    <span class="product-label">결제 금액</span>
                    <span class="product-value total-amount" id="totalAmount">10,000원</span>
                </div>
            </div>

            <!-- 주문자 정보 -->
            <form id="paymentForm">
                <div class="form-group">
                    <label>이름 *</label>
                    <input type="text" id="customerName" placeholder="홍길동" required>
                </div>
                <div class="form-group">
                    <label>이메일 *</label>
                    <input type="email" id="customerEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>휴대폰 번호 *</label>
                    <input type="tel" id="customerPhone" placeholder="01012345678 (하이픈 없이)" required>
                </div>

                <!-- 결제 수단 선택 -->
                <div class="payment-methods">
                    <h3>결제 수단 선택</h3>
                    <div class="method-grid">
                        <div class="method-card selected" data-method="카드" onclick="selectMethod('카드', this)">
                            <div class="method-icon"><i class="fas fa-credit-card"></i></div>
                            <div class="method-name">카드 결제</div>
                        </div>
                        <div class="method-card" data-method="계좌이체" onclick="selectMethod('계좌이체', this)">
                            <div class="method-icon"><i class="fas fa-building-columns"></i></div>
                            <div class="method-name">계좌이체</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="pay-button">
                    <i class="fas fa-lock"></i> 결제하기
                </button>

                <div class="notice">
                    <i class="fas fa-info-circle"></i>
                    결제 완료 후 이메일로 영수증이 발송됩니다.<br>
                    결제 관련 문의: aisaju1000@gmail.com
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🎉 실제 라이브 클라이언트 키 적용!
        const clientKey = 'live_gck_vZnjEJeQVxeXejY1v7ROrPmOoBN0';
        
        // URL 파라미터에서 상품 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('product') || urlParams.get('name') || urlParams.get('service') || urlParams.get('description') || '프리미엄 사주 분석';
        const amount = parseInt(urlParams.get('amount') || urlParams.get('price')) || 10000;
        
        console.log('📦 결제 정보:', { productName, amount });

        // 상품 정보 표시
        document.getElementById('productName').textContent = productName;
        document.getElementById('totalAmount').textContent = amount.toLocaleString() + '원';

        // 선택된 결제 수단
        let selectedMethod = '카드';

        // 결제 수단 선택
        function selectMethod(method, element) {
            selectedMethod = method;
            document.querySelectorAll('.method-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            console.log('✅ 결제수단 선택:', selectedMethod);
        }

        // 토스페이먼츠 초기화
        let tossPayments;
        try {
            tossPayments = TossPayments(clientKey);
            console.log('✅ TossPayments 초기화 완료 (라이브 환경)');
        } catch (error) {
            console.error('❌ TossPayments 초기화 실패:', error);
            alert('결제 시스템 초기화에 실패했습니다.\n페이지를 새로고침 후 다시 시도해주세요.');
        }

        // 결제 폼 제출
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!tossPayments) {
                alert('결제 시스템이 초기화되지 않았습니다.\n페이지를 새로고침 후 다시 시도해주세요.');
                return;
            }

            const customerName = document.getElementById('customerName').value.trim();
            const customerEmail = document.getElementById('customerEmail').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim().replace(/-/g, '');

            // 유효성 검사
            if (!customerName || !customerEmail || !customerPhone) {
                alert('모든 정보를 입력해주세요.');
                return;
            }
            
            if (!/^\d{10,11}$/.test(customerPhone)) {
                alert('휴대폰 번호는 10-11자리 숫자만 입력해주세요.\n예: 01012345678');
                return;
            }
            
            if (amount < 100) {
                alert('결제 금액은 100원 이상이어야 합니다.');
                return;
            }

            // 주문 ID 생성
            const orderId = 'ORDER_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            // 결제 데이터 준비
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            
            const paymentData = {
                order_id: orderId,
                customer_name: customerName,
                customer_email: customerEmail,
                customer_phone: customerPhone,
                amount: amount,
                product_name: productName,
                payment_method: selectedMethod,
                status: '대기',
                created_at: new Date().toISOString(),
                user_id: isLoggedIn && currentUser.id ? currentUser.id : null,
                is_member: isLoggedIn
            };
            
            console.log('💾 결제 정보 준비:', paymentData);
            
            // DB 저장 시도
            try {
                const saveResponse = await fetch('/tables/payments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData)
                });
                
                if (saveResponse.ok) {
                    console.log('✅ DB 저장 완료');
                } else {
                    console.warn('⚠️ DB 저장 실패, localStorage 백업');
                    localStorage.setItem('pending_payment_' + orderId, JSON.stringify(paymentData));
                }
            } catch (error) {
                console.warn('⚠️ DB 연결 실패, localStorage 백업');
                localStorage.setItem('pending_payment_' + orderId, JSON.stringify(paymentData));
            }

            // 고객 정보 저장
            localStorage.setItem('customerName', customerName);
            localStorage.setItem('customerEmail', customerEmail);
            localStorage.setItem('customerPhone', customerPhone);

            console.log('🚀 실제 결제 요청 시작:', {
                method: selectedMethod,
                amount: amount,
                orderId: orderId
            });

            // 토스페이먼츠 결제창 호출 (실제 결제)
            try {
                await tossPayments.requestPayment(selectedMethod, {
                    amount: amount,
                    orderId: orderId,
                    orderName: productName,
                    customerName: customerName,
                    customerEmail: customerEmail,
                    customerMobilePhone: customerPhone,
                    successUrl: window.location.origin + '/payment-success.html',
                    failUrl: window.location.origin + '/payment-fail.html'
                });
                
                console.log('✅ 실제 결제창 호출 성공');
            } catch (error) {
                console.error('❌ 결제 오류:', error);
                
                let errorMessage = '결제 중 오류가 발생했습니다.';
                if (error.code === 'USER_CANCEL') {
                    errorMessage = '결제가 취소되었습니다.';
                } else if (error.message) {
                    errorMessage += '\n\n' + error.message;
                }
                
                alert(errorMessage);
            }
        });

        // 페이지 로드 시 로그인 상태 확인
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            
            if (isLoggedIn && currentUser.name) {
                console.log('✅ 회원 로그인:', currentUser.name);
                
                document.getElementById('customerName').value = currentUser.name || '';
                document.getElementById('customerEmail').value = currentUser.email || '';
                document.getElementById('customerPhone').value = currentUser.phone || '';
                
                const memberNotice = document.createElement('div');
                memberNotice.style.cssText = `
                    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
                    border: 2px solid #4caf50;
                    border-radius: 15px;
                    padding: 20px;
                    margin-bottom: 25px;
                    text-align: center;
                `;
                memberNotice.innerHTML = `
                    <div style="font-size: 2em; margin-bottom: 10px;">✅</div>
                    <div style="color: #2e7d32; font-weight: 600; font-size: 1.1em;">
                        <strong>${currentUser.name}</strong>님 환영합니다!
                    </div>
                    <div style="color: #388e3c; font-size: 0.95em;">
                        회원 정보가 자동으로 입력되었습니다.
                    </div>
                `;
                
                const productInfo = document.querySelector('.product-info');
                productInfo.parentNode.insertBefore(memberNotice, productInfo);
                
            } else {
                console.log('ℹ️ 비회원 결제 모드');
                
                const savedName = localStorage.getItem('customerName');
                const savedEmail = localStorage.getItem('customerEmail');
                const savedPhone = localStorage.getItem('customerPhone');
                
                if (savedName) document.getElementById('customerName').value = savedName;
                if (savedEmail) document.getElementById('customerEmail').value = savedEmail;
                if (savedPhone) document.getElementById('customerPhone').value = savedPhone;
                
                const guestNotice = document.createElement('div');
                guestNotice.style.cssText = `
                    background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
                    border: 2px solid #ffc107;
                    border-radius: 15px;
                    padding: 20px;
                    margin-bottom: 25px;
                    text-align: center;
                `;
                guestNotice.innerHTML = `
                    <div style="font-size: 2em; margin-bottom: 10px;">💡</div>
                    <div style="color: #856404; font-weight: 600; font-size: 1em; margin-bottom: 8px;">
                        비회원으로 결제하시나요?
                    </div>
                    <div style="color: #856404; font-size: 0.9em; margin-bottom: 12px;">
                        회원이시면 정보가 자동으로 입력됩니다!
                    </div>
                    <a href="login.html" 
                       style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                              color: white; padding: 10px 25px; border-radius: 25px; text-decoration: none; 
                              font-weight: 600; font-size: 0.95em;">
                        <i class="fas fa-sign-in-alt"></i> 로그인하기
                    </a>
                `;
                
                const productInfo = document.querySelector('.product-info');
                productInfo.parentNode.insertBefore(guestNotice, productInfo);
            }
        });
    </script>
</body>
</html>
