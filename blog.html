<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 - AI 사주 천년지기</title>
    <meta name="description" content="사주, 운세, 궁합, 택일 등 다양한 정보를 제공하는 AI 사주 천년지기 블로그">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 네비게이션 로더 -->
    <script src="js/navbar-loader.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            /* 깜빡임 방지: 고정 높이 설정 */
            min-height: 200px;
            position: relative;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .category-filter {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .category-btn {
            padding: 0.7rem 1.5rem;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            /* 깜빡임 방지: 최소 높이 설정 */
            min-height: 400px;
        }

        .blog-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            /* 깜빡임 방지: 애니메이션 추가 */
            opacity: 1;
            animation: fadeIn 0.3s ease-in;
        }

        /* 부드러운 페이드인 효과 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 숨김 상태 */
        .blog-card.hidden {
            display: none;
        }

        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .blog-thumbnail {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .blog-content {
            padding: 1.5rem;
        }

        .blog-category {
            display: inline-block;
            background: #e7f3ff;
            color: #667eea;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .blog-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .blog-summary {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .blog-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .tag {
            background: #f1f3f5;
            color: #666;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .featured-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a1a;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
            font-size: 1.2rem;
        }

        /* 로딩 상태 스타일 */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #667eea;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <div id="navbar-placeholder"></div>

    <div class="hero">
        <h1>📝 블로그</h1>
        <p>사주, 운세, 궁합의 모든 것</p>
    </div>

    <div class="container">
        <div class="category-filter">
            <button class="category-btn active" data-category="all">전체</button>
            <button class="category-btn" data-category="사주">사주</button>
            <button class="category-btn" data-category="운세">운세</button>
            <button class="category-btn" data-category="궁합">궁합</button>
            <button class="category-btn" data-category="택일">택일</button>
            <button class="category-btn" data-category="작명">작명</button>
            <button class="category-btn" data-category="풍수">풍수</button>
        </div>

        <div class="blog-grid" id="blogGrid">
            <div class="loading">블로그를 불러오는 중...</div>
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            해당 카테고리의 블로그가 없습니다.
        </div>
    </div>

    <script>
        // ✅ 전역 변수로 데이터 캐싱 - 중복 로드 방지
        let allBlogs = [];
        let blogsLoaded = false;

        // ✅ 블로그 로드 (한 번만 실행)
        async function loadBlogs() {
            // 이미 로드했으면 스킵
            if (blogsLoaded) {
                console.log('✅ 블로그 이미 로드됨 - 스킵');
                return;
            }

            try {
                console.log('📡 블로그 데이터 로딩 시작...');
                const response = await fetch('/blogs-data.json');
                
                if (!response.ok) {
                    throw new Error('블로그 데이터를 불러올 수 없습니다.');
                }

                const blogsArray = await response.json();
                
                // 공개된 블로그만 필터링 및 정렬
                allBlogs = blogsArray
                    .filter(blog => blog.published === true)
                    .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
                
                blogsLoaded = true;
                console.log(`✅ ${allBlogs.length}개 블로그 로드 완료`);
                
                // 처음 로드 시에만 DOM 생성
                renderAllBlogs();
                
            } catch (error) {
                console.error('❌ 블로그 로드 실패:', error);
                document.getElementById('blogGrid').innerHTML = '';
                document.getElementById('noResults').style.display = 'block';
                document.getElementById('noResults').textContent = '블로그를 불러오는데 실패했습니다.';
            }
        }

        // ✅ 모든 블로그 카드를 한 번에 렌더링 (DOM 재생성 없음)
        function renderAllBlogs() {
            const grid = document.getElementById('blogGrid');
            grid.innerHTML = ''; // 로딩 메시지 제거

            if (allBlogs.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }

            document.getElementById('noResults').style.display = 'none';

            allBlogs.forEach(blog => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.setAttribute('data-category', blog.category);
                card.onclick = () => window.location.href = `blog-post.html?id=${blog.id}`;

                const tagsHTML = blog.tags && blog.tags.length > 0 
                    ? `<div class="blog-tags">${blog.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>`
                    : '';

                card.innerHTML = `
                    ${blog.featured ? '<div class="featured-badge">⭐ 추천</div>' : ''}
                    <img src="${blog.thumbnail || 'https://via.placeholder.com/350x220'}" 
                         alt="${blog.title}" class="blog-thumbnail" onerror="this.src='https://via.placeholder.com/350x220'">
                    <div class="blog-content">
                        <span class="blog-category">${blog.category}</span>
                        <h2 class="blog-title">${blog.title}</h2>
                        <p class="blog-summary">${blog.summary}</p>
                        ${tagsHTML}
                        <div class="blog-meta">
                            <span><i class="far fa-calendar"></i> ${new Date(blog.publishedAt).toLocaleDateString()}</span>
                            <span><i class="far fa-eye"></i> ${blog.views || 0}회</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            console.log(`✅ ${allBlogs.length}개 블로그 카드 렌더링 완료`);
        }

        // ✅ 카테고리 필터 (DOM 재생성 없이 show/hide만)
        function filterByCategory(category) {
            console.log(`🔍 카테고리 필터: ${category}`);
            
            const allCards = document.querySelectorAll('.blog-card');
            let visibleCount = 0;

            allCards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                    card.style.display = 'none';
                }
            });

            // 결과 없음 메시지 처리
            const noResults = document.getElementById('noResults');
            if (visibleCount === 0) {
                noResults.style.display = 'block';
                noResults.textContent = `'${category}' 카테고리의 블로그가 없습니다.`;
            } else {
                noResults.style.display = 'none';
            }

            console.log(`✅ ${visibleCount}개 블로그 표시`);
        }

        // ✅ 카테고리 버튼 이벤트 리스너 설정
        function setupCategoryButtons() {
            const buttons = document.querySelectorAll('.category-btn');
            
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    
                    // 활성화 상태 변경
                    buttons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 필터 적용 (DOM 재생성 없음!)
                    filterByCategory(category);
                });
            });

            console.log('✅ 카테고리 버튼 이벤트 설정 완료');
        }

        // ✅ 페이지 로드 시 초기화 (단 한 번만 실행)
        window.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 페이지 로드 시작');
            
            // 1. 블로그 데이터 로드 (한 번만)
            await loadBlogs();
            
            // 2. 카테고리 버튼 이벤트 설정
            setupCategoryButtons();
            
            console.log('✅ 초기화 완료 - 깜빡임 없음!');
        });
    </script>
</body>
</html>
