<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 - AI 사주 천년지기</title>
    <meta name="description" content="사주, 운세, 궁합, 택일 등 다양한 정보를 제공하는 AI 사주 천년지기 블로그">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 네비게이션 로더 -->
    <script src="js/navbar-loader.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .category-filter {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .category-btn {
            padding: 0.7rem 1.5rem;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .blog-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .blog-thumbnail {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .blog-content {
            padding: 1.5rem;
        }

        .blog-category {
            display: inline-block;
            background: #e7f3ff;
            color: #667eea;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .blog-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .blog-summary {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .blog-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .tag {
            background: #f1f3f5;
            color: #666;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .featured-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a1a;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <div id="navbar-placeholder"></div>

    <div class="hero">
        <h1>📝 블로그</h1>
        <p>사주, 운세, 궁합의 모든 것</p>
    </div>

    <div class="container">
        <div class="category-filter">
            <button class="category-btn active" onclick="filterCategory('all', event)">전체</button>
            <button class="category-btn" onclick="filterCategory('사주', event)">사주</button>
            <button class="category-btn" onclick="filterCategory('운세', event)">운세</button>
            <button class="category-btn" onclick="filterCategory('궁합', event)">궁합</button>
            <button class="category-btn" onclick="filterCategory('택일', event)">택일</button>
            <button class="category-btn" onclick="filterCategory('작명', event)">작명</button>
            <button class="category-btn" onclick="filterCategory('풍수', event)">풍수</button>
        </div>

        <div class="blog-grid" id="blogGrid">
            <!-- 동적 로드 -->
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            블로그가 없습니다.
        </div>
    </div>

    <script>
        let allBlogs = [];
        let currentCategory = 'all';

        // 블로그 로드
        async function loadBlogs() {
            try {
                const response = await fetch('/tables/blogs?limit=100&sort=-publishedAt');
                const data = await response.json();
                
                // 공개된 블로그만 필터링
                allBlogs = data.data.filter(blog => blog.published);
                
                displayBlogs(allBlogs);
            } catch (error) {
                console.error('블로그 로드 실패:', error);
                document.getElementById('noResults').style.display = 'block';
            }
        }

        // 블로그 표시
        function displayBlogs(blogs) {
            const grid = document.getElementById('blogGrid');
            const noResults = document.getElementById('noResults');

            if (blogs.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            grid.innerHTML = '';

            blogs.forEach(blog => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.onclick = () => window.location.href = `blog-post.html?id=${blog.id}`;

                const tagsHTML = blog.tags && blog.tags.length > 0 
                    ? `<div class="blog-tags">${blog.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>`
                    : '';

                card.innerHTML = `
                    ${blog.featured ? '<div class="featured-badge">⭐ 추천</div>' : ''}
                    <img src="${blog.thumbnail || 'https://via.placeholder.com/350x220'}" 
                         alt="${blog.title}" class="blog-thumbnail" onerror="this.src='https://via.placeholder.com/350x220'">
                    <div class="blog-content">
                        <span class="blog-category">${blog.category}</span>
                        <h2 class="blog-title">${blog.title}</h2>
                        <p class="blog-summary">${blog.summary}</p>
                        ${tagsHTML}
                        <div class="blog-meta">
                            <span><i class="far fa-calendar"></i> ${new Date(blog.publishedAt).toLocaleDateString()}</span>
                            <span><i class="far fa-eye"></i> ${blog.views || 0}회</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // 카테고리 필터
        function filterCategory(category, event) {
            currentCategory = category;

            // 버튼 활성화
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 필터링
            const filtered = category === 'all' 
                ? allBlogs 
                : allBlogs.filter(blog => blog.category === category);

            displayBlogs(filtered);
        }

        // 페이지 로드 시
        window.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
