<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 상세 - AI 사주 천년지기</title>
    <meta name="description" content="AI 사주 천년지기 블로그 상세 페이지">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 네비게이션 로더 -->
    <script src="js/navbar-loader.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .back-button:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }

        .blog-header {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 썸네일 완전 제거 */

        .blog-category {
            display: inline-block;
            background: #e7f3ff;
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .blog-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .blog-meta {
            display: flex;
            gap: 2rem;
            color: #999;
            font-size: 0.95rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }

        .blog-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .blog-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .tag {
            background: #f1f3f5;
            color: #666;
            padding: 0.4rem 0.9rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .blog-content {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .blog-content h2 {
            color: #333;
            font-size: 1.8rem;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #667eea;
        }

        .blog-content h3 {
            color: #444;
            font-size: 1.4rem;
            margin: 1.5rem 0 1rem 0;
        }

        .blog-content p {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 1.2rem;
        }

        .blog-content ul, .blog-content ol {
            margin: 1rem 0 1.5rem 2rem;
            color: #555;
        }

        .blog-content li {
            margin-bottom: 0.8rem;
            line-height: 1.7;
        }

        .blog-content strong {
            color: #333;
            font-weight: 600;
        }

        .blog-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: white;
        }

        .blog-content table th,
        .blog-content table td {
            padding: 1rem;
            border: 1px solid #ddd;
            text-align: left;
        }

        .blog-content table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .blog-content table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .cta-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 2.5rem;
            text-align: center;
            margin-top: 3rem;
        }

        .cta-box h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .cta-box p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .cta-button {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1rem 2.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .error-message {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .error-message h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #667eea;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .blog-title {
                font-size: 1.8rem;
            }

            .blog-header,
            .blog-content {
                padding: 2rem;
            }

            .blog-meta {
                flex-direction: column;
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <div id="navbar-placeholder"></div>

    <div class="container">
        <a href="blog.html" class="back-button">
            <i class="fas fa-arrow-left"></i> 블로그 목록으로
        </a>

        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i> 블로그를 불러오는 중...
        </div>

        <div id="blogPost" style="display: none;">
            <!-- 동적 로드 -->
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <h2>😕 블로그를 찾을 수 없습니다</h2>
            <p>요청하신 블로그가 존재하지 않거나 삭제되었습니다.</p>
            <a href="blog.html" class="cta-button">블로그 목록 보기</a>
        </div>
    </div>

    <script>
        async function loadBlogPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            if (!blogId) {
                showError();
                return;
            }

            try {
                console.log(`🔄 블로그 ID "${blogId}" 로딩 중...`);
                const response = await fetch('/blogs-data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const blogs = await response.json();
                const blog = blogs.find(b => b.id === blogId && b.published);

                if (!blog) {
                    console.error(`❌ ID "${blogId}"에 해당하는 블로그를 찾을 수 없습니다.`);
                    showError();
                    return;
                }

                console.log('✅ 블로그 찾음:', blog.title);
                displayBlog(blog);
            } catch (error) {
                console.error('❌ 블로그 로드 실패:', error);
                showError();
            }
        }

        function displayBlog(blog) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('blogPost').style.display = 'block';

            const tagsHTML = blog.tags && blog.tags.length > 0 
                ? `<div class="blog-tags">${blog.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}</div>`
                : '';

            // 썸네일 이미지 완전 제거
            document.getElementById('blogPost').innerHTML = `
                <div class="blog-header">
                    <span class="blog-category">${blog.category}</span>
                    <h1 class="blog-title">${blog.title}</h1>
                    <div class="blog-meta">
                        <span><i class="far fa-calendar"></i> ${new Date(blog.publishedAt).toLocaleDateString('ko-KR')}</span>
                        <span><i class="fas fa-user"></i> ${blog.author}</span>
                        <span><i class="far fa-eye"></i> ${(blog.views || 0).toLocaleString()}회</span>
                    </div>
                    ${tagsHTML}
                </div>

                <div class="blog-content">
                    ${blog.content}

                    <div class="cta-box">
                        <h3>🔮 무료 AI 사주 풀이</h3>
                        <p>내 사주팔자를 AI로 무료 분석해보세요!</p>
                        <a href="index.html" class="cta-button">무료 사주 보기</a>
                    </div>
                </div>
            `;

            // 메타 태그 업데이트
            document.title = `${blog.title} - AI 사주 천년지기`;
            
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.content = blog.summary;
            }

            console.log('✅ 블로그 렌더링 완료');
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }

        // 페이지 로드 시
        window.addEventListener('DOMContentLoaded', loadBlogPost);
    </script>
</body>
</html>
