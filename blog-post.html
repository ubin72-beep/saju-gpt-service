<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">블로그 - AI 사주 천년지기</title>
    <meta name="description" id="pageDescription" content="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 네비게이션 로더 -->
    <script src="js/navbar-loader.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .back-btn {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .post-header {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .post-category {
            display: inline-block;
            background: #e7f3ff;
            color: #667eea;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .post-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .post-meta {
            display: flex;
            gap: 2rem;
            color: #999;
            font-size: 0.95rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .post-thumbnail {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .post-content {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            line-height: 1.8;
            font-size: 1.05rem;
            color: #333;
        }

        .post-content h2 {
            font-size: 1.8rem;
            margin: 2rem 0 1rem;
            color: #333;
            font-weight: 700;
        }

        .post-content h3 {
            font-size: 1.4rem;
            margin: 1.5rem 0 1rem;
            color: #444;
            font-weight: 600;
        }

        .post-content p {
            margin-bottom: 1.5rem;
        }

        .post-content ul,
        .post-content ol {
            margin: 1.5rem 0;
            padding-left: 2rem;
        }

        .post-content li {
            margin-bottom: 0.8rem;
        }

        .post-content strong {
            color: #667eea;
            font-weight: 600;
        }

        .post-content a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .post-content a:hover {
            text-decoration: underline;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }

        .post-content table th,
        .post-content table td {
            padding: 0.8rem;
            border: 1px solid #ddd;
            text-align: center;
        }

        .post-content table th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .post-content blockquote {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
        }

        .post-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }

        .tag {
            background: #e7f3ff;
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cta-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2.5rem;
            border-radius: 15px;
            text-align: center;
            margin-top: 3rem;
        }

        .cta-box h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .cta-box p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .btn-cta {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .btn-cta:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,255,255,0.3);
        }

        @media (max-width: 768px) {
            .post-title {
                font-size: 1.8rem;
            }

            .post-thumbnail {
                height: 250px;
            }

            .post-header,
            .post-content,
            .cta-box {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 바 -->
    <div id="navbar-placeholder"></div>

    <div class="container">
        <a href="blog.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 블로그 목록으로
        </a>

        <div class="post-header">
            <span class="post-category" id="postCategory"></span>
            <h1 class="post-title" id="postTitle"></h1>
            <div class="post-meta">
                <span><i class="far fa-calendar"></i> <span id="postDate"></span></span>
                <span><i class="fas fa-user"></i> <span id="postAuthor"></span></span>
                <span><i class="far fa-eye"></i> <span id="postViews"></span>회</span>
            </div>
        </div>

        <img id="postThumbnail" class="post-thumbnail" alt="">

        <div class="post-content" id="postContent">
            <!-- 동적 로드 -->
        </div>

        <div class="post-tags" id="postTags">
            <!-- 동적 로드 -->
        </div>

        <div class="cta-box">
            <h3>🔮 무료 사주 분석 받아보세요!</h3>
            <p>AI 사주 천년지기에서 나만의 맞춤 사주 분석을 시작하세요</p>
            <a href="index.html" class="btn-cta">
                무료 시작하기 <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <script>
        // URL에서 블로그 ID 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        if (!blogId) {
            window.location.href = 'blog.html';
        }

        // 블로그 로드
        async function loadBlog() {
            try {
                const response = await fetch('/blogs-data.json');
                
                if (!response.ok) {
                    throw new Error('블로그 데이터를 찾을 수 없습니다');
                }

                const blogsArray = await response.json();
                const blog = blogsArray.find(b => b.id === blogId);

                if (!blog) {
                    throw new Error('블로그를 찾을 수 없습니다');
                }

                // 조회수 증가 (정적 사이트이므로 실제로는 증가하지 않음)
                const currentViews = blog.views || 0;

                // 페이지 제목 및 메타 설정
                document.getElementById('pageTitle').textContent = blog.title + ' - AI 사주 천년지기';
                document.getElementById('pageDescription').content = blog.summary;

                // 콘텐츠 표시
                document.getElementById('postCategory').textContent = blog.category;
                document.getElementById('postTitle').textContent = blog.title;
                document.getElementById('postDate').textContent = new Date(blog.publishedAt).toLocaleDateString();
                document.getElementById('postAuthor').textContent = blog.author;
                document.getElementById('postViews').textContent = currentViews + 1;
                
                // 썸네일
                const thumbnail = document.getElementById('postThumbnail');
                if (blog.thumbnail) {
                    thumbnail.src = blog.thumbnail;
                    thumbnail.style.display = 'block';
                } else {
                    thumbnail.style.display = 'none';
                }

                // 본문
                document.getElementById('postContent').innerHTML = blog.content;

                // 태그
                const tagsContainer = document.getElementById('postTags');
                if (blog.tags && blog.tags.length > 0) {
                    tagsContainer.innerHTML = blog.tags.map(tag => 
                        `<span class="tag"><i class="fas fa-tag"></i> ${tag}</span>`
                    ).join('');
                } else {
                    tagsContainer.style.display = 'none';
                }

            } catch (error) {
                console.error('블로그 로드 실패:', error);
                alert('블로그를 불러올 수 없습니다.');
                window.location.href = 'blog.html';
            }
        }

        // 페이지 로드 시
        window.addEventListener('DOMContentLoaded', loadBlog);
    </script>
</body>
</html>
